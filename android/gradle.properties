android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# The backend the app talks to. Overridden per build with -PchronosHost=<host>,
# so building against staging never needs a commit.
chronosHost=chronos.tevproject.com

# Firebase Auth (email/password only). These two are public by design — app.py
# serves them unauthenticated at /auth/config, and a Web API key is not a secret.
fbApiKey=AIzaSyAm1u_hCAtjh42Z05Lk8_3oWeyk9AwQVys
fbProjectId=teacheraifrontend

# The Android app id, from the com.chronos.tutor registration under the
# teacheraifrontend project. The project MUST match the one app.py verifies ID
# tokens against — an id from another project mints tokens the backend rejects
# with 401 on every call. (This was first registered under clash-42eeb, the
# ProductivityApp project, which would have failed every sign-in.)
fbAppId=1:535751529969:android:2b6454cfa9f4e02b9c6050
