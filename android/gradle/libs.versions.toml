# One place for every version. AGP/Gradle/Kotlin are a compatibility triple:
# Gradle 8.9 (see gradle-wrapper.properties) supports AGP 8.7.x, and AGP 8.7
# supports Kotlin 2.0.x. Bumping any one of the three means checking the other two.
[versions]
agp                = "8.7.3"
kotlin             = "2.0.21"
coreKtx            = "1.15.0"
composeBom         = "2024.12.01"
activityCompose    = "1.9.3"
lifecycle          = "2.8.7"
navigation         = "2.8.5"
datastore          = "1.1.1"
splashscreen       = "1.0.1"
okhttp             = "4.12.0"
serialization      = "1.7.3"
firebaseBom        = "33.7.0"
coroutinesPlay     = "1.9.0"
junit              = "4.13.2"
androidxTestJunit  = "1.2.1"

[libraries]
core-ktx              = { module = "androidx.core:core-ktx",                         version.ref = "coreKtx" }
splashscreen          = { module = "androidx.core:core-splashscreen",                version.ref = "splashscreen" }

# Compose: the BOM pins every compose artifact, so those carry no version.
compose-bom           = { module = "androidx.compose:compose-bom",                   version.ref = "composeBom" }
compose-ui            = { module = "androidx.compose.ui:ui" }
compose-graphics      = { module = "androidx.compose.ui:ui-graphics" }
compose-tooling       = { module = "androidx.compose.ui:ui-tooling" }
compose-tooling-prev  = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3     = { module = "androidx.compose.material3:material3" }
activity-compose      = { module = "androidx.activity:activity-compose",             version.ref = "activityCompose" }

lifecycle-vm-compose  = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime     = { module = "androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }
# repeatOnLifecycle lives here, not in -compose. MainActivity needs it to hold
# the splash without reading Compose state from outside a composition.
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx",       version.ref = "lifecycle" }
navigation-compose    = { module = "androidx.navigation:navigation-compose",         version.ref = "navigation" }
datastore-prefs       = { module = "androidx.datastore:datastore-preferences",       version.ref = "datastore" }

# okhttp-sse carries the /chat streaming framing; see the Streaming section of the plan.
okhttp                = { module = "com.squareup.okhttp3:okhttp",                    version.ref = "okhttp" }
okhttp-sse            = { module = "com.squareup.okhttp3:okhttp-sse",                version.ref = "okhttp" }
okhttp-logging        = { module = "com.squareup.okhttp3:logging-interceptor",       version.ref = "okhttp" }
okhttp-mockwebserver  = { module = "com.squareup.okhttp3:mockwebserver",             version.ref = "okhttp" }

serialization-json    = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Auth ONLY. firestore.rules denies all client access, so the Firestore SDK
# would have nothing to talk to — every read and write goes through app.py.
firebase-bom          = { module = "com.google.firebase:firebase-bom",               version.ref = "firebaseBom" }
firebase-auth         = { module = "com.google.firebase:firebase-auth-ktx" }
coroutines-play       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutinesPlay" }

junit                 = { module = "junit:junit",                                    version.ref = "junit" }
androidx-test-junit   = { module = "androidx.test.ext:junit",                        version.ref = "androidxTestJunit" }
compose-ui-test       = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-manifest   = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application",                 version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",            version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin" }
kotlin-serialization= { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
