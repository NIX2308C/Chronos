plugins {
    id 'com.android.application'
}

// One source of truth for the host, so the manifest's intent filter, the
// asset-statement and the launch URL can never drift apart.
def twaHost = project.findProperty('twaHost') ?: 'chronos.tevproject.com'
def twaUrl  = "https://${twaHost}/login.html"   // matches manifest.json's start_url

// Release signing comes from the environment, never from a file in the repo —
// this is a public repository. CI writes the keystore to a temp path from a
// GitHub Actions secret and exports these four vars. With any of them missing
// the release config simply isn't created, and the build falls back to debug
// rather than silently emitting an unsigned APK nobody can install.
def ksPath   = System.getenv('CHRONOS_KEYSTORE_PATH')
def ksPass   = System.getenv('CHRONOS_KEYSTORE_PASSWORD')
def ksAlias  = System.getenv('CHRONOS_KEY_ALIAS')
def ksKeyPass = System.getenv('CHRONOS_KEY_PASSWORD')
def canSignRelease = ksPath && ksPass && ksAlias && ksKeyPass && file(ksPath).exists()

android {
    namespace 'com.chronos.tutor'
    compileSdk 35

    signingConfigs {
        if (canSignRelease) {
            create('release') {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    defaultConfig {
        applicationId "com.chronos.tutor"
        // 21 is the floor for androidbrowserhelper; a TWA additionally needs
        // Chrome 72+ at runtime, which is a Chrome check rather than an API one.
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        resValue "string", "twa_host", twaHost
        resValue "string", "twa_url", twaUrl
        // The digital asset-links statement the TWA verifies against. Escaped
        // because it is a single string resource holding JSON.
        resValue "string", "asset_statements",
                 "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], " +
                 "\\\"target\\\": { \\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${twaHost}\\\" } }]"

        manifestPlaceholders = [twaHost: twaHost]
    }

    buildTypes {
        debug {
            // Debug signing only. It sideloads fine and cannot go to Play, which
            // needs a release key and Play App Signing.
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.getByName('release')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Supplies LauncherActivity, so this project has no Java source of its own.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
