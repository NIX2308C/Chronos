# Builds the Chronos TWA and publishes the APK as a GitHub Release asset.
#
# This runs here rather than locally on purpose: the Android SDK and Google's
# Maven repository both live on dl.google.com, which is unreachable from the
# environment the project is developed in. GitHub's runners ship the SDK.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      host:
        description: >-
          Host the app should open, with no scheme. Defaults to the live site;
          override only to build against staging.
        required: true
        default: chronos.tevproject.com
  push:
    branches: [android-app]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write        # needed to create the release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the target host
        id: cfg
        run: |
          HOST="${{ github.event.inputs.host || 'chronos.tevproject.com' }}"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$HOST" | tr '.' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Not android-actions/setup-android: it runs `sdkmanager tools`, and the
      # `tools` package was removed from the SDK, so it fails outright. The
      # runner image already ships the SDK — this just accepts the licences and
      # installs the pieces this build needs, with no third-party action.
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK"      >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK"  >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      # Release-sign when the keystore secret exists, otherwise fall back to a
      # debug build so the workflow still works for anyone without it. The
      # keystore never lives in the repo: it is decoded to a temp file here and
      # the runner is destroyed afterwards.
      - name: Signing mode
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Release signing: keystore secret present."
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, building debug. The installed app will show a URL bar."
          fi

      - name: Decode the keystore
        if: steps.sign.outputs.mode == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/chronos.jks"
          # Strip whitespace first: pasting a few thousand base64 characters into
          # a browser field is exactly where stray newlines come from, and they
          # would otherwise fail the decode for a reason nobody can see.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KS" || {
            echo "::error::Could not base64-decode ANDROID_KEYSTORE_BASE64. Re-copy it with Set-Clipboard -Value, not through an editor."
            exit 1
          }
          test -s "$KS" || { echo "::error::keystore decoded to an empty file — is the secret set?"; exit 1; }
          # A JKS starts with the magic bytes FE ED FE ED; a PKCS12 is a DER
          # sequence starting 30 82. Anything else means a truncated or wrong
          # paste, and failing here beats a confusing Gradle error later.
          MAGIC=$(head -c 2 "$KS" | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feed|3082) echo "Keystore looks valid ($(stat -c%s "$KS") bytes)." ;;
            *) echo "::error::Decoded file is not a keystore (starts $MAGIC). The secret is probably truncated."; exit 1 ;;
          esac
          echo "CHRONOS_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          CHRONOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHRONOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHRONOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            ./gradlew --no-daemon assembleRelease -PtwaHost=${{ steps.cfg.outputs.host }}
          else
            ./gradlew --no-daemon assembleDebug -PtwaHost=${{ steps.cfg.outputs.host }}
          fi

      - name: Name the artefact
        id: apk
        run: |
          set -euo pipefail
          MODE="${{ steps.sign.outputs.mode }}"
          SRC="android/app/build/outputs/apk/$MODE/app-$MODE.apk"
          test -s "$SRC" || { echo "::error::no APK produced at $SRC"; exit 1; }
          OUT="chronos-${{ steps.cfg.outputs.slug }}-$MODE.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      # The fingerprint is public by design — it is what assetlinks.json serves.
      # Reading it off the built APK means nobody has to run keytool locally,
      # and comparing it to the committed file catches the mismatch that is the
      # usual reason the URL bar refuses to go away.
      - name: Signing fingerprint vs assetlinks.json
        id: fp
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          FP=$("$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}" \
               | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' \
               | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          WANT=$(python3 -c "import json;print(json.load(open('web/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0])")
          {
            echo "### Signing fingerprint"
            echo
            echo '```'
            echo "$FP"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FP" = "$WANT" ]; then
            echo "match=yes" >> "$GITHUB_OUTPUT"
            echo "assetlinks.json already matches this key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "match=no" >> "$GITHUB_OUTPUT"
            echo "::warning::assetlinks.json does not match this APK's key, so the app will show a URL bar. Put the fingerprint above into web/.well-known/assetlinks.json and redeploy."
            echo "**The app will show a URL bar.** \`web/.well-known/assetlinks.json\` currently has a different fingerprint. Copy the one above into it and redeploy the site." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --target "${{ github.sha }}" \
            --title "Chronos Android (${{ steps.sign.outputs.mode }}) — build ${{ github.run_number }}" \
            --prerelease \
            --notes "Trusted Web Activity built from \`android/\`, **${{ steps.sign.outputs.mode }}**-signed.

          **Opens:** \`https://${{ steps.cfg.outputs.host }}/login.html\`

          **Signing SHA-256:**
          \`\`\`
          ${{ steps.fp.outputs.fingerprint }}
          \`\`\`
          assetlinks.json matches this key: **${{ steps.fp.outputs.match }}**. If that
          says \`no\`, the app shows a browser URL bar — put the fingerprint above
          into \`web/.well-known/assetlinks.json\` and redeploy the site.

          A debug-signed APK cannot go to Play. To build against a different
          host, re-run this workflow from the Actions tab and set \`host\`."
