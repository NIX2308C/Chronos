# Builds the Chronos TWA and publishes the APK as a GitHub Release asset.
#
# This runs here rather than locally on purpose: the Android SDK and Google's
# Maven repository both live on dl.google.com, which is unreachable from the
# environment the project is developed in. GitHub's runners ship the SDK.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      host:
        description: >-
          Host the app should open, with no scheme (e.g. chronos-xyz.a.run.app).
          Leave as the default until Chronos is deployed.
        required: true
        default: chronos-not-deployed-yet.invalid
  push:
    branches: [android-app]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write        # needed to create the release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the target host
        id: cfg
        run: |
          HOST="${{ github.event.inputs.host || 'chronos-not-deployed-yet.invalid' }}"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          # A release built against the placeholder must say so in its name,
          # so a stale APK can't be mistaken for one pointing at the real site.
          if [ "$HOST" = "chronos-not-deployed-yet.invalid" ]; then
            echo "slug=placeholder" >> "$GITHUB_OUTPUT"
          else
            echo "slug=$(echo "$HOST" | tr '.' '-')" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PtwaHost=${{ steps.cfg.outputs.host }}

      - name: Name the artefact
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$SRC" || { echo "::error::no APK produced at $SRC"; exit 1; }
          OUT="chronos-${{ steps.cfg.outputs.slug }}-debug.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --target "${{ github.sha }}" \
            --title "Chronos Android (debug) — build ${{ github.run_number }}" \
            --prerelease \
            --notes "Debug-signed Trusted Web Activity, built from \`android/\`.

          **Opens:** \`https://${{ steps.cfg.outputs.host }}/login.html\`

          Sideload only — a debug-signed APK cannot be uploaded to Play, which
          needs a release key and Play App Signing. It will show a browser URL
          bar until the host serves \`/.well-known/assetlinks.json\` carrying the
          SHA-256 of the key that signed this build.

          To point it at a real deployment, run this workflow again from the
          Actions tab and set the \`host\` input."
