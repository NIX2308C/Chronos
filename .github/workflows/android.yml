# Builds the native Chronos Android app and publishes the APK as a GitHub
# Release asset. (Through build 6 this built a Trusted Web Activity; that
# project is preserved on the `twa-legacy` branch, which carries its own copy
# of this workflow and can still be built from the Actions tab.)
#
# This runs here rather than locally on purpose: the Android SDK and Google's
# Maven repository both live on dl.google.com, which is unreachable from the
# environment the project is developed in. GitHub's runners ship the SDK.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      apiHost:
        description: >-
          Backend host the app talks to, with no scheme. Defaults to the live
          site; override only to build against staging.
        required: true
        default: chronos.tevproject.com
  push:
    branches: [main, native-android]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write        # needed to create the release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the target host
        id: cfg
        run: |
          HOST="${{ github.event.inputs.apiHost || 'chronos.tevproject.com' }}"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$HOST" | tr '.' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Not android-actions/setup-android: it runs `sdkmanager tools`, and the
      # `tools` package was removed from the SDK, so it fails outright. The
      # runner image already ships the SDK — this just accepts the licences and
      # installs the pieces this build needs, with no third-party action.
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK"      >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK"  >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      # Release-sign when the keystore secret exists, otherwise fall back to a
      # debug build so the workflow still works for anyone without it. The
      # keystore never lives in the repo: it is decoded to a temp file here and
      # the runner is destroyed afterwards.
      - name: Signing mode
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Release signing: keystore secret present."
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, building debug-signed."
          fi

      - name: Decode the keystore
        if: steps.sign.outputs.mode == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/chronos.jks"
          # Strip whitespace first: pasting a few thousand base64 characters into
          # a browser field is exactly where stray newlines come from, and they
          # would otherwise fail the decode for a reason nobody can see.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KS" || {
            echo "::error::Could not base64-decode ANDROID_KEYSTORE_BASE64. Re-copy it with Set-Clipboard -Value, not through an editor."
            exit 1
          }
          test -s "$KS" || { echo "::error::keystore decoded to an empty file — is the secret set?"; exit 1; }
          # A JKS starts with the magic bytes FE ED FE ED; a PKCS12 is a DER
          # sequence starting 30 82. Anything else means a truncated or wrong
          # paste, and failing here beats a confusing Gradle error later.
          MAGIC=$(head -c 2 "$KS" | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feed|3082) echo "Keystore looks valid ($(stat -c%s "$KS") bytes)." ;;
            *) echo "::error::Decoded file is not a keystore (starts $MAGIC). The secret is probably truncated."; exit 1 ;;
          esac
          echo "CHRONOS_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      # Cheap, and it is what catches a regression in the ported logic before an
      # APK anyone can install exists.
      - name: Unit tests
        id: tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Downloading the run log needs admin rights, so a red build is otherwise
      # opaque to anyone without them. This puts the reason — a Kotlin compile
      # error or a failed assertion — straight into the job summary.
      - name: Why it failed
        if: failure() && steps.tests.outcome == 'failure'
        working-directory: android
        run: |
          {
            echo "### Failure output"
            echo
            echo '```'
            grep -E "^e: |FAILED|expected:|actual:|AssertionError|Unresolved reference|Caused by" "$RUNNER_TEMP/test.log" | head -60
            echo '```'
            echo
            echo "<details><summary>Last 80 lines</summary>"
            echo
            echo '```'
            tail -80 "$RUNNER_TEMP/test.log"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Also emit the reason as a workflow error. Annotations are readable
          # through the public API without admin rights, unlike the run log and
          # the job summary, so this is the only channel that makes a red build
          # diagnosable from outside the repo. sed/awk do the percent-encoding
          # the workflow-command protocol wants; bash ${var//...} needs a
          # literal newline in the pattern, which YAML will not carry.
          # Gradle prints the real cause under "What went wrong", below the
          # FAILED line — grepping only for FAILED named the task that broke
          # but never the file that broke it.
          WHY=$(sed -n "/What went wrong/,/Try:/p" "$RUNNER_TEMP/test.log" | head -30)
          ERRS=$(grep -E "^e: |AssertionError|Unresolved reference|error:" "$RUNNER_TEMP/test.log" | head -20)
          PICK=$(printf "%s" "$WHY"; echo; printf "%s" "$ERRS")
          [ -n "$PICK" ] || PICK=$(tail -25 "$RUNNER_TEMP/test.log")
          REASON=$(echo "$PICK" | sed "s/%/%25/g" | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build or test failure::$REASON"

      - name: Build APK
        working-directory: android
        env:
          CHRONOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHRONOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHRONOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Not a secret — it ships inside every APK — but it is
          # environment-specific. Falls back to gradle.properties when unset.
          FB_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: |
          # Only pass -PfbAppId when the variable is actually set. Passing it
          # empty OVERRIDES the value committed in gradle.properties, which
          # silently shipped a build that could never authenticate.
          ARGS="-PchronosHost=${{ steps.cfg.outputs.host }}"
          if [ -n "$FB_APP_ID" ]; then ARGS="$ARGS -PfbAppId=$FB_APP_ID"; fi
          echo "gradle args: $ARGS"
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            ./gradlew --no-daemon assembleRelease $ARGS
          else
            ./gradlew --no-daemon assembleDebug $ARGS
          fi

      - name: Name the artefact
        id: apk
        run: |
          set -euo pipefail
          MODE="${{ steps.sign.outputs.mode }}"
          SRC="android/app/build/outputs/apk/$MODE/app-$MODE.apk"
          test -s "$SRC" || { echo "::error::no APK produced at $SRC"; exit 1; }
          OUT="chronos-${{ steps.cfg.outputs.slug }}-$MODE.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      # The fingerprint is public by design. There is no assetlinks.json check
      # any more: Digital Asset Links only mattered while the app was a Trusted
      # Web Activity, and a native app verifies nothing against the site. It is
      # still printed, because Play App Signing will want it one day.
      - name: Signing fingerprint
        id: fp
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          FP=$("$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          {
            echo "### Signing fingerprint"
            echo
            echo '```'
            echo "$FP"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --target "${{ github.sha }}" \
            --title "Chronos Android (${{ steps.sign.outputs.mode }}) — build ${{ github.run_number }}" \
            --prerelease \
            --notes "Native Android app built from \`android/\`, **${{ steps.sign.outputs.mode }}**-signed.

          **Talks to:** \`https://${{ steps.cfg.outputs.host }}\`

          **Signing SHA-256:**
          \`\`\`
          ${{ steps.fp.outputs.fingerprint }}
          \`\`\`

          A debug-signed APK cannot go to Play. To build against a different
          backend, re-run this workflow from the Actions tab and set \`apiHost\`."
