<style>
    /* Custom components use these vars so they follow the theme on their own;
       theme.css only has to repoint the Tailwind-generated utility classes. */
    :root{--c-page:#E9E4D6;--c-paper:#F7F4EC;--c-ink:#141311;--c-sub:#5D5B55;--c-edge:#1C1A16;
          --c-hi:#E4DECD;--c-rule:#DED8C6;--crimson:#E2001A;--gold:#C9A227;
          --snap:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.22,1,.36,1)}
    /* One shared, gentler curve for every Tailwind colour/transform transition. */
    html .transition-colors,html .transition-transform,html .transition-opacity,html .transition-all { transition-duration:.22s; transition-timing-function:var(--soft) }
    html { scroll-behavior:smooth }
    @keyframes rise-in { from { opacity:0;transform:translateY(7px) } to { opacity:1;transform:none } }
    @keyframes slide-in-left { from { opacity:0;transform:translateX(-8px) } to { opacity:1;transform:none } }
    @keyframes fade-in { from { opacity:0 } to { opacity:1 } }
    @keyframes menu-in { from { opacity:0;transform:translateY(6px) scale(.98) } to { opacity:1;transform:none } }
    @keyframes chip-in { from { opacity:0;transform:scale(.92) } to { opacity:1;transform:none } }
    html.dark{--c-page:#0D0D10;--c-paper:#16161B;--c-ink:#F7F4EC;--c-sub:#B3AEA3;--c-edge:#3D3D46;
              --c-hi:#212128;--c-rule:#303038;color-scheme:dark}

    body { font-family: 'Schibsted Grotesk', sans-serif; }
    h1,h2,h3,h4 { font-family: 'Newsreader', serif; font-weight:400; letter-spacing: -.015em; }
    ::selection { background: var(--crimson); color: #F7F4EC; }
    :focus-visible { outline: 2px solid var(--crimson); outline-offset: 2px; }
    .material-symbols-outlined { font-family: 'Material Symbols Sharp'; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
    .mono { font-family: 'Schibsted Grotesk', sans-serif; }
    /* Custom classes below set `display`, which would beat Tailwind's .hidden on a
       tie. Scope the fix to those classes — a blanket `.hidden{display:none!important}`
       also outranks `md:flex`/`sm:inline`, which permanently hides every element that
       is meant to appear only at a breakpoint (e.g. the sidebar). */
    .hidden.kbtn, .hidden.ibtn, .hidden.chat-row { display:none; }
    .tagline { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }

    .chat-scroll::-webkit-scrollbar { width: 8px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background-color: var(--c-edge); }

    /* ---- shared shapes ---- */
    .hard { border:1px solid var(--c-rule); }
    /* Dialogs: a neutral edge and a soft shadow, not a red border. */
    .cast-red { border-color:var(--c-rule) !important; box-shadow:0 20px 48px rgba(0,0,0,.2); }

    /* ---- message bubbles ---- */
    .bub-you { max-width:78%; background:var(--crimson); color:#F7F4EC; padding:12px 16px;
        font-size:15.5px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere;
        transform-origin:100% 100% }
    /* The answer is the page, not a card in it: plain serif on the paper, no
       chrome around it. Only the question gets a bubble. */
    .bub-ai { color:var(--c-ink); font-family:'Newsreader',serif; font-size:19px; line-height:1.62;
        overflow-wrap:anywhere }
    /* A refusal, not an answer: same bubble, visibly set apart by the rule down
       its edge so the thread reads differently at a glance. Existing tokens only. */
    .bub-ai.bub-blocked { color:var(--c-sub); border-left:3px solid var(--crimson);
        padding-left:14px }
    @keyframes pop { from{opacity:0;transform:translateY(10px) scale(.97)} to{opacity:1;transform:none} }
    /* Entrance motion is opt-in per element (.enter) so that reopening a
       conversation or re-rendering the list never replays it: only what is
       genuinely new on screen moves. */
    #messagesInner > .enter { animation:rise-in .22s var(--soft) both }
    .enter .bub-you { animation:pop .26s var(--snap) both }
    #chatList .chat-row.enter { animation:slide-in-left .18s var(--soft) both;animation-delay:calc(var(--i,0)*16ms) }
    .starter { transition:color .15s var(--soft) }
    .file-chip { animation:chip-in .25s var(--snap) both }
    .composer-menu:not([hidden]) { animation:menu-in .18s var(--soft) both;transform-origin:0 100% }
    .composer-menu button { transition:background-color .18s,color .18s,padding-left .18s var(--soft) }
    .composer-menu button:hover { padding-left:13px }
    #statusDot,[data-status-dot] { transition:background-color .35s ease }

    /* ---- sidebar conversation rows ---- */
    .chat-row { display:flex; align-items:center; border-left:3px solid transparent; color:var(--c-sub);
        transition:background-color .18s ease,border-color .2s var(--snap),color .18s ease }
    .chat-row:hover { background:var(--c-hi); color:var(--c-ink) }
    .chat-row.on { background:var(--c-hi); border-left-color:var(--crimson); color:var(--c-ink) }
    .chat-row:focus-within .chat-delete { opacity:1 }
    @media (hover:none){ .chat-delete { opacity:1!important } }

    /* ---- buttons ---- */
    .kbtn { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
        font-size:14px; font-weight:600; padding:.85rem 1rem; border:1px solid var(--crimson); background:var(--crimson);
        color:#F7F4EC; cursor:pointer; transition:background-color .15s ease,border-color .15s ease,transform .15s ease }
    .kbtn:hover:not(:disabled) { background:#B90015; border-color:#B90015; color:#F7F4EC; transform:translateY(-1px) }
    .kbtn:active:not(:disabled) { transform:translateY(0) }
    .kbtn:disabled { opacity:.55; cursor:default }
    .kbtn-ghost { background:transparent; border-color:var(--c-rule); color:var(--c-ink) }
    .kbtn-ghost:hover:not(:disabled) { color:var(--c-ink); border-color:var(--c-ink); background:transparent }

    .ibtn { width:34px; height:34px; display:flex; align-items:center; justify-content:center;
        border:1px solid transparent; color:var(--c-sub);
        transition:background-color .15s,color .15s,border-color .15s }
    .ibtn:hover { background:var(--crimson); border-color:var(--crimson); color:#F7F4EC }

    .slabel { font-size:12.5px; font-weight:600; color:var(--c-sub) }
    .sendbtn { width:40px; height:40px; flex:none; display:flex; align-items:center; justify-content:center;
        background:var(--c-ink); color:var(--c-page); border:none; cursor:pointer; transition:background-color .15s ease,color .15s ease,transform .15s ease }
    .sendbtn:hover:not(:disabled) { background:var(--crimson); color:#F7F4EC }
    .sendbtn:active:not(:disabled) { transform:scale(.94) }
    .sendbtn:disabled { opacity:.4; cursor:default }

    /* empty-state starter questions */
    .starter { display:flex; align-items:center; justify-content:space-between; gap:1rem; width:100%;
        text-align:left; background:transparent; border:none; border-bottom:1px solid var(--c-rule);
        padding:15px 4px; font:inherit; font-size:15.5px; color:var(--c-ink); cursor:pointer;
        transition:color .15s ease }
    .starter:hover { color:var(--crimson) }

    /* ---- input bar ---- */
    .composer { background:var(--c-paper); border:1px solid var(--c-rule); transition:border-color .15s ease }
    .composer:focus-within { border-color:var(--crimson) }
    /* Debug mode (developer accounts): the chat box glows red. */
    .composer.debug-on { border-color:var(--crimson); box-shadow:0 0 0 1px var(--crimson),0 0 18px rgba(226,0,26,.38) }
    .dbg-strip { display:none; font:500 11.5px/1.4 ui-monospace,Consolas,monospace; color:var(--c-sub); padding:0 2px 6px;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .dbg-strip.on { display:block }
    .dbg-strip b { color:var(--crimson); font-weight:600 }
    details.dbg { margin-top:10px; width:100%; max-width:100%; font:12px/1.5 ui-monospace,Consolas,monospace; color:var(--c-sub);
        border-left:2px solid var(--crimson); padding-left:10px }
    details.dbg > summary { cursor:pointer; list-style:none; user-select:none }
    details.dbg > summary::-webkit-details-marker { display:none }
    details.dbg > summary::before { content:"▸ "; color:var(--crimson) }
    details.dbg[open] > summary::before { content:"▾ " }
    .dbg-body { padding:8px 0 4px; display:grid; gap:10px }
    .dbg-body h4 { margin:0 0 3px; font:600 11px/1.3 'Schibsted Grotesk',sans-serif; text-transform:uppercase; letter-spacing:.06em; color:var(--c-ink) }
    .dbg-kv { display:grid; grid-template-columns:auto 1fr; gap:1px 14px }
    .dbg-kv span:nth-child(odd) { color:var(--c-sub) }
    .dbg-kv span:nth-child(even) { color:var(--c-ink); text-align:right }
    .dbg-bar { height:3px; background:var(--c-rule); margin-top:2px }
    .dbg-bar > i { display:block; height:100%; background:var(--crimson) }
    .dbg-bar > i.drop { background:var(--c-sub);opacity:.4 }
    .dbg-pre { margin:0; max-height:220px; overflow:auto; white-space:pre-wrap; background:var(--c-hi); padding:8px; color:var(--c-ink) }
    .dbg-actions { display:flex; gap:8px }
    .dbg-actions button { font:inherit; color:var(--c-ink); background:transparent; border:1px solid var(--c-rule); padding:3px 9px; cursor:pointer }
    .dbg-actions button:hover { border-color:var(--crimson); color:var(--crimson) }
    .chat-skel { display:grid; gap:10px; padding:10px 12px }

    /* ---- compact composer actions ---- */
    .composer-action { width:36px;height:36px;flex:none;display:grid;place-items:center;
        border:1px solid var(--c-rule);background:transparent;color:var(--c-sub);cursor:pointer;
        transition:color .16s ease,border-color .16s ease,background-color .16s ease,transform .16s ease; }
    .composer-action:hover:not(:disabled),.composer-action:focus-visible,.composer-action[aria-expanded="true"] { color:var(--crimson);border-color:var(--crimson); }
    .composer-action:active:not(:disabled) { transform:scale(.94); }
    .composer-action:disabled { opacity:.45;cursor:default; }
    .composer-menu { position:absolute;bottom:calc(100% + 10px);left:0;z-index:10;
        width:min(250px,calc(100vw - 48px));padding:6px;background:var(--c-paper);
        border:1px solid var(--c-rule);box-shadow:0 12px 28px rgba(0,0,0,.14); }
    .composer-menu[hidden],.composer-action[hidden] { display:none; }
    .composer-menu button { width:100%;display:flex;align-items:center;gap:10px;padding:10px 11px;
        border:0;background:transparent;color:var(--c-ink);text-align:left;font:inherit;font-size:13px;cursor:pointer; }
    .composer-menu button:hover,.composer-menu button:focus-visible { background:var(--c-hi);color:var(--crimson); }
    .composer-menu .menu-hint { display:block;padding:7px 11px 4px;color:var(--c-sub);font-size:12px;line-height:1.35; }
    #fileBar[hidden] { display:none; }
    .file-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 9px;
        font-size:12.5px; background:var(--c-hi); color:var(--c-ink); max-width:15rem }
    .file-chip .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .file-chip button { background:none; border:none; padding:0; cursor:pointer; color:var(--c-sub);
        display:flex; align-items:center }
    .file-chip button:hover { color:var(--crimson) }

    .fld { background:var(--c-paper); border:1px solid var(--c-rule); color:var(--c-ink); border-radius:0;
        transition:border-color .15s }
    .fld:focus { outline:none; border-color:var(--crimson) }

    /* ---- compact source disclosure ---- */
    .src-drop { width:fit-content;max-width:min(100%,560px);margin-top:12px;color:var(--c-sub); }
    .src-toggle { display:flex;align-items:center;gap:5px;padding:4px 0;border:0;background:transparent;color:inherit;font:inherit;font-size:11px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;cursor:pointer;opacity:.7;transition:color .25s var(--soft),opacity .25s var(--soft); }
    .src-toggle:hover,.src-drop.open .src-toggle { color:var(--c-ink);opacity:1; }
    .src-toggle .chev { margin-left:2px;transition:transform .4s var(--soft); }
    .src-drop.open .chev { transform:rotate(180deg); }
    /* Grid rows 0fr -> 1fr animates height without measuring it, so opening
       never shoves the thread around; the text itself is one small, capped,
       scrollable block. */
    .src-panel { display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .45s var(--soft),opacity .35s ease,visibility 0s .45s; }
    .src-drop.open .src-panel { grid-template-rows:1fr;opacity:1;visibility:visible;transition-delay:0s; }
    .src-panel > div { overflow:hidden;min-height:0; }
    .src-drop .source-copy { max-height:168px;overflow-y:auto;margin:4px 0 0;padding:9px 12px;border-left:2px solid var(--c-rule);background:var(--c-hi);font-size:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere; }
    .src-drop .source-copy::-webkit-scrollbar { width:6px; }
    .src-drop .source-copy::-webkit-scrollbar-thumb { background:var(--c-edge); }
    .learning-tool { width:100%;max-width:620px;border:1px solid var(--c-rule);padding:18px;margin-top:14px;background:var(--c-paper);box-shadow:0 10px 28px rgba(11,11,12,.06); }
    .learning-tool { transform-origin:0 0; }
    .learning-tool.toolkit-enter { animation:toolkit-arrive .55s var(--soft) both; }
    .learning-tool.toolkit-enter .tool-topline,.learning-tool.toolkit-enter .tool-nav,.learning-tool.toolkit-enter .map-node,.learning-tool.toolkit-enter .map-link,.learning-tool.toolkit-enter .review-sec,.learning-tool.toolkit-enter .tool-bar { animation:rise-in .4s var(--soft) both;animation-delay:calc(var(--i,0)*45ms + 140ms); }
    /* Tool status is plain text, not a chip: it pops in, and while the tool runs
       a soft crimson glow travels through the letters along a figure-eight
       (x completes one loop while y completes two, a 1:2 Lissajous). */
    @property --gx { syntax:"<percentage>";inherits:false;initial-value:50%; }
    @property --gy { syntax:"<percentage>";inherits:false;initial-value:50%; }
    .tool-status { position:relative;display:flex;align-items:center;gap:12px;width:fit-content;max-width:100%;margin-top:14px;padding:2px 0;color:var(--c-sub);font-size:14px;font-weight:500;line-height:1.4;letter-spacing:.01em;animation:tool-text-in .45s var(--soft) both; }
    .tool-status .tool-text { position:relative;display:inline-block; }
    .tool-status.using { color:var(--c-sub); }
    .tool-status.using .tool-text::after { content:attr(data-text);position:absolute;left:0;top:0;white-space:nowrap;color:transparent;pointer-events:none;
        background:radial-gradient(40px 13px at var(--gx) var(--gy),#FF3B52 0%,rgba(226,0,26,.8) 38%,transparent 75%);
        -webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 3px rgba(226,0,26,.5));
        animation:glow-x 2.4s ease-in-out infinite alternate,glow-y 1.2s ease-in-out -.6s infinite alternate; }
    .tool-status.done { color:#1E7A4E;animation:tool-finish .45s var(--soft) both; }
    .tool-status.failed { color:var(--crimson); }
    .tool-status.canceled { color:var(--c-sub);opacity:.8; }
    html.dark .tool-status.done { color:#6FD5A0; }
    html.dark .tool-status.failed { color:#FF6572; }
    .tool-status.leaving { overflow:hidden;animation:tool-out .35s cubic-bezier(.5,0,.75,0) both; }
    .tool-status button { border:0;background:transparent;color:var(--c-sub);opacity:.75;text-decoration:underline;text-underline-offset:3px;font:inherit;font-size:12px;cursor:pointer;transition:color .2s,opacity .2s; }
    .tool-status button:hover { color:var(--crimson);opacity:1; }
    @keyframes tool-text-in { from { opacity:0;transform:translateY(6px);filter:blur(2px); } to { opacity:1;transform:none;filter:blur(0); } }
    @keyframes glow-x { from { --gx:0%; } to { --gx:100%; } }
    @keyframes glow-y { from { --gy:0%; } to { --gy:100%; } }
    @keyframes tool-finish { 0% { opacity:.4;transform:translateY(4px);filter:blur(1px); } 100% { opacity:1;transform:none;filter:blur(0); } }
    @keyframes tool-out { from { opacity:1;transform:none;max-height:34px;margin-top:14px; } to { opacity:0;transform:translateY(-8px);max-height:0;margin-top:0;padding-top:0;padding-bottom:0; } }
    @keyframes toolkit-arrive { 0% { opacity:0;transform:translateY(12px); } 100% { opacity:1;transform:none; } }
    .stream-tail { overflow-wrap:anywhere;min-height:1lh; }
    /* Thinking indicator: a solid crimson block cursor, blinking. */
    .typing-indicator { display:inline-block;width:.55em;height:1.05em;background:var(--crimson);vertical-align:text-bottom;animation:cursor-blink 1.05s steps(1,end) infinite; }
    @keyframes cursor-blink { 0%,55% { opacity:1; } 56%,100% { opacity:0; } }
    .tool-heading { font-family:'Newsreader',serif;font-size:22px;line-height:1.15;margin:0;color:var(--c-ink); }
    .tool-topline { display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px; }
    .tool-count { color:var(--c-sub);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap; }
    .tool-stage { min-height:235px;display:flex;flex-direction:column; }
    .tool-prompt { margin:2px 0 16px;font-family:'Newsreader',serif;font-size:21px;line-height:1.25;color:var(--c-ink); }
    .quiz-options { display:grid;gap:8px; }

<!-- Main -->
<main class="flex-1 flex flex-col min-w-0 md:ml-64 h-full bg-surface-container-lowest">
<!-- Mobile header -->
<header data-mobile-header class="md:hidden fixed top-0 w-full bg-surface-container-lowest flex items-center gap-3 px-margin-mobile z-20" style="border-bottom:1px solid var(--c-rule)">
<button data-drawer-toggle="sm" class="text-on-surface-variant -ml-2.5" aria-label="Open menu" title="Menu">
<span class="material-symbols-outlined text-[22px]">menu</span>
</button>
<span class="min-w-0 flex-1">
<span class="block truncate font-label-md text-[15px] leading-tight text-on-background" data-thread-title>New chat</span>
<span class="block truncate font-body-md text-[12px] text-on-surface-variant" data-thread-class></span>
</span>
<span class="w-2 h-2 block flex-none bg-outline" data-status-dot title="Checking…"></span>
<button class="w-11 h-11 flex-none flex items-center justify-center bg-primary text-on-primary" id="newChatBtnMobile">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</header>

<!-- Desktop header: which conversation, which class, and whether we're online -->
<header class="hidden md:flex flex-none items-center justify-between gap-5 px-8 py-3.5" style="border-bottom:1px solid var(--c-rule)">
<div class="min-w-0">
<div class="font-label-md text-[16px] leading-tight text-on-background truncate" id="threadTitle" data-thread-title>New chat</div>
<div class="font-body-md text-[13px] text-on-surface-variant mt-0.5 truncate" id="threadClass" data-thread-class></div>
</div>
<span class="flex items-center gap-2 flex-none font-body-md text-[13px] text-on-surface-variant">
<span class="w-2 h-2 block bg-outline" id="statusDot" data-status-dot></span>
<span id="statusText" data-status-text></span>
</span>
</header>

<!-- Chat column -->
<section data-chat-col class="flex-1 flex flex-col min-h-0 pt-16 md:pt-0 w-full">
<div class="flex-1 min-h-0 overflow-y-auto chat-scroll px-6 md:px-8 pt-8 pb-6" id="messages" data-transition-content>
<div class="max-w-[720px] mx-auto" id="messagesInner"></div>
</div>
<!-- Input -->
<div data-composer class="flex-none px-6 md:px-8 pt-4 pb-3.5" style="border-top:1px solid var(--c-rule)">
<div class="max-w-[720px] mx-auto">
<!-- The student's own work stays in this conversation. -->
<div class="flex items-center flex-wrap gap-2 mb-2" id="fileBar" hidden>
<span class="flex items-center flex-wrap gap-2" id="fileChips"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant normal-case tracking-normal" id="fileErr"></span>
<input accept=".pdf,.docx,.txt,.md,.csv" class="hidden" id="fileInput" type="file"/>
</div>
<div class="dbg-strip" id="dbgStrip" aria-live="polite"></div>
<div class="composer relative p-2 flex items-end gap-2" id="composerBox">
<div class="relative flex items-end gap-1.5 flex-none">
<button type="button" class="composer-action" id="addFileBtn" aria-label="Add to conversation" aria-haspopup="menu" aria-expanded="false" title="Add to conversation"><span class="material-symbols-outlined text-[21px]">add</span></button>
<button type="button" class="composer-action" id="toolBtn" aria-label="Create learning activity" aria-haspopup="menu" aria-expanded="false" title="Create learning activity" hidden><span class="material-symbols-outlined text-[19px]">auto_awesome</span></button>
<div class="composer-menu" id="addFileMenu" role="menu" hidden>
<button type="button" role="menuitem" data-add-kind="assignment"><span class="material-symbols-outlined text-[18px]">upload_file</span>Add assignment</button>
<button type="button" role="menuitem" data-add-kind="rubric"><span class="material-symbols-outlined text-[18px]">checklist</span>Add rubric</button>
<button type="button" role="menuitem" data-add-kind="file"><span class="material-symbols-outlined text-[18px]">attach_file</span>Add file</button>
</div>
<div class="composer-menu" id="toolMenu" role="menu" hidden></div>
</div>
<textarea class="w-full bg-transparent border-none focus:ring-0 resize-none max-h-32 min-h-[44px] py-2 px-0 font-body-md text-[15.5px] text-on-surface placeholder:text-on-surface-variant" id="input" placeholder="Ask a question…" rows="1"></textarea>
<button class="sendbtn" id="sendBtn" title="Send">
<span class="material-symbols-outlined fill text-[19px]">arrow_upward</span>
</button>
</div>
</div>
</div>
</section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="mobile.js"></script>
<script src="transition.js"></script>
<script src="settings.js"></script>
<script>
  // Backend base (same-origin in deployment; dev server via Live Server/file://).
  // Chronos.BASE comes from auth.js and uses the same detection.
  const API_BASE=Chronos.BASE;

  // --- tiny self-contained markdown renderer (bold, italics, lists, code, headings, links) ---
  // Quotes are escaped too: mdInline drops a matched URL straight into href="…",
  // so anything reaching an attribute has to be quote-safe. Today the URL pattern
  // forbids whitespace and can't start a second attribute, but that's one regex
  // tweak away from being live XSS in model output.
  function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function mdInline(s){
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    s=s.replace(/__(.+?)__/g,"<strong>$1</strong>");
    s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
    s=s.replace(/(^|[^_\w])_([^_\n]+)_/g,"$1<em>$2</em>");
    return s;
  }
  function renderMarkdown(src){
    const NUL=String.fromCharCode(0),blocks=[],inls=[];
    let text=String(src).replace(/\r\n/g,"\n");
    text=text.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{blocks.push(escapeHtml(code.replace(/\n+$/,"")));return NUL+"CB"+(blocks.length-1)+NUL;});
    text=escapeHtml(text);
    text=text.replace(/`([^`\n]+)`/g,(m,code)=>{inls.push(code);return NUL+"IC"+(inls.length-1)+NUL;});
    const lines=text.split("\n");let html="",i=0;
    const isUL=l=>/^\s*[\-\*\+]\s+/.test(l),isOL=l=>/^\s*\d+\.\s+/.test(l),isH=l=>/^#{1,6}\s+/.test(l),isQ=l=>/^>\s?/.test(l),isCB=l=>new RegExp("^"+NUL+"CB\\d+"+NUL+"$").test(l);
    while(i<lines.length){
      let line=lines[i];
      if(/^\s*$/.test(line)){i++;continue;}
      if(isCB(line)){const n=line.match(/CB(\d+)/)[1];html+="<pre><code>"+blocks[+n]+"</code></pre>";i++;continue;}
      let h=line.match(/^(#{1,6})\s+(.*)$/);
      if(h){const lv=Math.min(h[1].length,3);html+="<h"+lv+">"+mdInline(h[2])+"</h"+lv+">";i++;continue;}
      if(isQ(line)){let buf=[];while(i<lines.length&&isQ(lines[i])){buf.push(lines[i].replace(/^>\s?/,""));i++;}html+="<blockquote>"+mdInline(buf.join("<br>"))+"</blockquote>";continue;}
      if(isUL(line)){let buf="";while(i<lines.length&&isUL(lines[i])){buf+="<li>"+mdInline(lines[i].replace(/^\s*[\-\*\+]\s+/,""))+"</li>";i++;}html+="<ul>"+buf+"</ul>";continue;}
      if(isOL(line)){let buf="";while(i<lines.length&&isOL(lines[i])){buf+="<li>"+mdInline(lines[i].replace(/^\s*\d+\.\s+/,""))+"</li>";i++;}html+="<ol>"+buf+"</ol>";continue;}
      let buf=[];
      while(i<lines.length&&!/^\s*$/.test(lines[i])&&!isH(lines[i])&&!isQ(lines[i])&&!isUL(lines[i])&&!isOL(lines[i])&&!isCB(lines[i])){buf.push(lines[i]);i++;}
      html+="<p>"+mdInline(buf.join("<br>"))+"</p>";
    }
    html=html.replace(new RegExp(NUL+"IC(\\d+)"+NUL,"g"),(m,n)=>"<code>"+inls[+n]+"</code>");
    html=html.replace(new RegExp(NUL+"CB(\\d+)"+NUL,"g"),(m,n)=>"<pre><code>"+blocks[+n]+"</code></pre>");
    return html;
  }

  // Conversations are stored server-side per signed-in student (cloud sync) and
  // each belongs to a class. The tutor answers from the active class's rules.
  // Local chat shape: {id, title, classId, messages:[], loaded:bool, isNew:bool}
  //   id      — the server chat_id once saved; a temp id before the first message
  //   loaded  — whether this chat's messages have been fetched from the server
  //   isNew   — a blank conversation not yet persisted on the server
  let chats=[],activeChatId=null,USER=null,IS_TEACHER=false;
  let ALL_CHATS=[],CLASSES=[],ACTIVE_CLASS=null;     // class state
  // Activity types this course has switched on, as reported by /chat. Empty
  // until the first answer, so no practice chips are offered before then.
  let TOOLKITS=[];
  const CLASS_KEY="chronos_student_class";
  const els={chatList:document.getElementById("chatList"),messagesInner:document.getElementById("messagesInner"),input:document.getElementById("input"),sendBtn:document.getElementById("sendBtn"),newChatBtn:document.getElementById("newChatBtn"),newChatBtnMobile:document.getElementById("newChatBtnMobile"),messages:document.getElementById("messages")};
  const chatTransition=ChronosNav.createViewTransition(document.querySelector("[data-chat-col]"));
  let navigationBusy=false,sending=false,toolRunning=false;
  let IS_DEV=false,DEBUG=false;   // developer accounts only; decided by the server (/auth/me)
  const uiPref=(k,d)=>{const v=(window.ChronosTheme?ChronosTheme.ui():{})[k];return v===undefined?d:v;};

  function tempId(){return"new_"+Math.random().toString(36).slice(2,10);}
  function activeChat(){return chats.find(c=>c.id===activeChatId);}

  function newChat(){
    if(!ACTIVE_CLASS)return;
    // Don't stack blank chats — reuse an existing empty one if present.
    const blank=chats.find(c=>c.isNew&&c.messages.length===0);
    const c=blank||{id:tempId(),title:"New chat",classId:ACTIVE_CLASS,messages:[],loaded:true,isNew:true};
    if(!blank){chats.unshift(c);ALL_CHATS.unshift(c);}
    return selectChat(c.id);
  }

  // Everything visible changes together, in one frame, once the conversation is
  // ready. `animate` is only for a change of course, where the list is new.
  function commitChat(c,id,classId,data){
    const previous=activeChat();
    if(previous){previous.draft=els.input.value;previous.scrollTop=els.messages.scrollTop;}
    invalidateView();
    const courseChanged=classId!==ACTIVE_CLASS;
    c.messages=data.messages;c.loaded=true;c.files=data.files.files;c.filesLoaded=true;
    if(data.files.max)FILE_MAX=data.files.max;
    ACTIVE_CLASS=classId;localStorage.setItem(CLASS_KEY,classId);
    chats=ALL_CHATS.filter(x=>x.classId===classId);
    activeChatId=id;FILES=c.files;
    fileErr("");syncToolkits();paintClassSwitcher();renderSidebar(courseChanged);renderFiles();renderMessages();
    els.input.value=c.draft||"";
    els.input.style.height="auto";
    els.input.style.height=Math.min(els.input.scrollHeight,160)+"px";
    if(Number.isFinite(c.scrollTop))els.messages.scrollTop=c.scrollTop;
    setSending(false);
  }

  async function selectChat(id,classId=ACTIVE_CLASS){
    const c=ALL_CHATS.find(x=>x.id===id&&x.classId===classId);
    if(!c)return false;
    if(id===activeChatId&&classId===ACTIVE_CLASS&&!navigationBusy)return true;
    // Already in memory (visited, prefetched, or brand new): swap in the same
    // frame, with no spinner, no fade and no waiting.
    if(c.loaded&&(c.filesLoaded||c.isNew)){
      chatTransition.cancel();
      navigationBusy=false;
      commitChat(c,id,classId,{messages:c.messages,files:{files:c.files||[]}});
      return true;
    }
    navigationBusy=true;updateComposer();
    const switched=await chatTransition.show(async()=>{
      const [messages,files]=await Promise.all([loadMessages(c),fetchFiles(c)]);
      return {messages,files};
    },data=>commitChat(c,id,classId,data),
    {label:"Opening conversation",onError:()=>fileErr("Could not open that conversation. Please try again.")});
    if(switched||!document.querySelector("[data-chat-col]").hasAttribute("aria-busy")){
      navigationBusy=false;updateComposer();
    }
    return switched;
  }

  // Start fetching a conversation before it is clicked, so the click is instant.
  function warmChat(c){
    if(!c||c.isNew||c._warming||(c.loaded&&c.filesLoaded))return;
    c._warming=true;
    Promise.all([loadMessages(c),fetchFiles(c)]).then(([messages,files])=>{
      if(!c.loaded){c.messages=messages;c.loaded=true;}
      if(!c.filesLoaded){c.files=files.files;c.filesLoaded=true;if(files.max)FILE_MAX=files.max;}
    }).catch(()=>{}).finally(()=>{c._warming=false;});
  }

  async function loadMessages(c){
    if(c.loaded)return c.messages;
    const d=await Chronos.apiJson("/chats/"+encodeURIComponent(c.id)+"/messages",undefined,"GET");
    // Students receive the answer status, not the underlying teacher sources.
    return (d.messages||[]).map(m=>({role:m.role,content:m.content,rules:m.rules||[],
      sources:m.sources||[],tool:m.tool||null,
      reviewed:!!m.reviewed,blocked:!!m.blocked,
      gap:m.role==="teacher"&&!!m.material_gap&&!m.reviewed&&!m.blocked}));
  }

  async function deleteChat(id){
    const c=chats.find(x=>x.id===id);if(!c)return;
    if(!c.isNew){
      if(!confirm("Delete this conversation?"))return;
      try{await Chronos.apiJson("/chats/"+encodeURIComponent(id),undefined,"DELETE");}
      catch(e){setStatus("offline");return;}
    }else if(id===activeChatId&&FILES.length){
      // A blank conversation can already have immediate-context attachments.
      // Remove those too so abandoning the draft cannot leave private files orphaned.
      try{
        await Promise.all(FILES.map(f=>Chronos.apiJson("/student/files/"+encodeURIComponent(f.id),undefined,"DELETE")));
        FILES=[];
      }catch(e){fileErr("Could not remove this conversation’s files.");return;}
    }
    chats=chats.filter(x=>x.id!==id);
    ALL_CHATS=ALL_CHATS.filter(x=>x.id!==id);
    if(activeChatId===id){ if(chats.length)selectChat(chats[0].id); else newChat(); }
    else renderSidebar();
  }

  // With a long history, a filter box appears above the list. Below the
  // threshold it stays out of the way.
  let chatFilter="";
  const CHAT_FILTER_MIN=12;

  function renderSidebar(animate=false){
    const scroll=els.chatList.scrollTop;
    els.chatList.innerHTML="";
    paintHeader();
    const box=$s("chatSearchWrap");
    box.classList.toggle("hidden",chats.length<CHAT_FILTER_MIN);
    if(chats.length<CHAT_FILTER_MIN)chatFilter="";
    const q=chatFilter.trim().toLowerCase();
    const shown=q?chats.filter(c=>c.id===activeChatId||(c.title||"").toLowerCase().includes(q)):chats;
    if(q&&shown.length===0){
      const p=document.createElement("p");p.className="px-3 py-2 text-[13px] text-on-surface-variant";
      p.textContent="No matches";els.chatList.appendChild(p);
    }
    shown.forEach((c,i)=>{
      const on=c.id===activeChatId;
      const row=document.createElement("div");
      row.className="group chat-row"+(on?" on":"")+(animate?" enter":"");
      row.style.setProperty("--i",Math.min(i,10));
      const it=document.createElement("button");
      it.className="flex-1 min-w-0 text-left px-3 py-2.5 font-label-md text-label-md truncate";
      it.textContent=c.title;
      it.onclick=()=>selectChat(c.id);
      const warm=()=>warmChat(c);
      row.addEventListener("pointerenter",warm,{passive:true});
      it.addEventListener("focus",warm);
      row.addEventListener("touchstart",warm,{passive:true});
      const del=document.createElement("button");
      del.className="chat-delete px-2 opacity-0 group-hover:opacity-100 transition-opacity hover:text-error flex-shrink-0";
      del.dataset.drawerKeep="1";   // deleting a conversation shouldn't shut the drawer
      del.title="Delete conversation";
      del.innerHTML='<span class="material-symbols-outlined text-[18px]">delete</span>';
      del.onclick=(e)=>{e.stopPropagation();deleteChat(c.id);};
      row.appendChild(it);row.appendChild(del);
      els.chatList.appendChild(row);
    });
    els.chatList.scrollTop=scroll;
  }

  // Class-agnostic openers — the server has no notion of suggested questions, so
  // these work against any class's material rather than inventing topics.
  const STARTERS=["What does this course cover so far?","Explain the main idea from the latest material.","What should I revise first?"];

  function className(){const c=CLASSES.find(x=>x.id===ACTIVE_CLASS);return c?c.name:"";}

  // Both headers carry the same data-* hooks: the desktop one at md and up, the
  // mobile one below it. Writing to every match means a phone finally shows which
  // conversation and which course it is looking at.
  function paintAll(sel,text){document.querySelectorAll(sel).forEach(el=>{el.textContent=text;});}

  function paintHeader(){
    const c=activeChat();
    paintAll("[data-thread-title]",(c&&c.title)||"New chat");
    paintAll("[data-thread-class]",className());
  }

  function renderMessages(){
    const c=activeChat();
    els.messagesInner.innerHTML="";
    paintHeader();
    if(!c||c.messages.length===0){
      const e=document.createElement("div");
      e.className="pt-10 pb-2 empty-state";
      const h=document.createElement("h2");
      h.className="font-headline-lg text-headline-lg text-on-background mb-6";
      // textContent, not innerHTML: the class name is teacher-supplied.
      h.textContent="Ask anything from "+(className()||"this course");
      const list=document.createElement("div");
      list.style.borderTop="1px solid var(--c-rule)";
      STARTERS.forEach((t,i)=>{
        const b=document.createElement("button");
        b.className="starter";
        b.innerHTML='<span></span><span class="material-symbols-outlined text-[19px] text-on-surface-variant flex-shrink-0">arrow_forward</span>';
        b.firstChild.textContent=t;
        b.onclick=()=>{els.input.value=t;send();};
        list.appendChild(b);
      });
      e.appendChild(h);e.appendChild(list);
      els.messagesInner.appendChild(e);
      return;
    }
    c.messages.forEach(m=>els.messagesInner.appendChild(buildMsgEl(m)));
    scrollBottom();
  }

  // What a practice chip should be about: the student's most recent question.
  function practiceTopic(chat){
    for(let i=chat.messages.length-1;i>=0;i--){
      const m=chat.messages[i];
      if(m.role==="student"&&m.content)return m.content.slice(0,300);
    }
    return chat.title||"this course";
  }

  function buildMsgEl(m){
    if(m.role==="tool_status")return buildToolStatus(m);
    if(m.role==="student"){
      const w=document.createElement("div");w.className="flex flex-col items-end mb-stack-lg pr-1.5";
      const b=document.createElement("div");
      b.className="bub-you";
      b.textContent=m.content;
      w.appendChild(b);return w;
    }
    const w=document.createElement("div");w.className="flex flex-col items-start mb-stack-lg";
    const b=document.createElement("div");
    b.className="ai-prose bub-ai"+(m.blocked?" bub-blocked":"");
    if(m.content){b.innerHTML=renderMarkdown(m.content);}
    w.appendChild(b);
    // An answer with no sources behind it is the "not in this class's material"
    // refusal — the same empty-rules signal the server counts as a knowledge gap.
    if(m.blocked)w.appendChild(blockedNote());
    else if(m.gap)w.appendChild(gapNote());
    if(m.reviewed)w.appendChild(reviewedNote());
    // Sources are teacher-only: students never see the underlying material,
    // teachers get a collapsible dropdown beneath the answer. The role check
    // wraps the whole expression — keying it off "the server sent sources" is
    // what used to put the dropdown in front of students.
    const sources=IS_TEACHER?((m.sources&&m.sources.length)?m.sources:(m.rules||[])):[];
    if(sources.length){w.appendChild(buildSourcesDropdown(sources));}
    if(m.debug&&DEBUG)w.appendChild(buildDebugPanel(m.debug));
    // Built once and reused. renderMessages rebuilds the thread on any unrelated
    // change (a new chat in the sidebar, a title update), and rebuilding the
    // activity there wiped every answer the student had already given and
    // replayed the .learning-tool pop animation each time.
    if(m.tool){
      if(!m._toolEl){m._toolEl=buildLearningTool(m.tool);}
      else{m._toolEl.classList.remove("toolkit-enter");}
      w.appendChild(m._toolEl);
    }
    return w;
  }

  // The tutor refused: the message had profanity in it and never reached the
  // model. Said once, under the reply, so the student knows this was a decision
  // rather than the app breaking.
  function blockedNote(){
    const p=document.createElement("p");
    p.className="mt-3.5 text-on-surface-variant text-[13.5px] leading-relaxed";
    p.textContent="This message was flagged and wasn\u2019t answered.";
    return p;
  }

  function gapNote(){
    const p=document.createElement("p");
    p.className="mt-3.5 text-primary text-[13.5px] leading-relaxed";
    p.textContent="Not in the course material yet. Your teacher can see this.";
    return p;
  }

  // Answered from the work the student attached, because nothing in the class
  // material matched. The teacher still counts it as a gap — but printing "not in
  // my knowledge base" under a full review of their essay would just be untrue.
  function reviewedNote(){
    const p=document.createElement("p");
    p.className="mt-3.5 text-on-surface-variant text-[13.5px] leading-relaxed";
    p.textContent="Based on the work you attached — your course material doesn’t cover this.";
    return p;
  }

  // Teacher-only "Sources used" dropdown: a collapsed disclosure under an answer
  // that expands to the exact passages the tutor drew on. Hidden from students.
  function buildSourcesDropdown(rules){
    const d=document.createElement("div");
    d.className="src-drop";
    const s=document.createElement("button");
    s.type="button";s.className="src-toggle select-none";s.setAttribute("aria-expanded","false");
    s.innerHTML='<span class="material-symbols-outlined text-[16px]">menu_book</span>'+
      '<span>Sources used ('+rules.length+')</span>'+
      '<span class="material-symbols-outlined text-[18px] chev">expand_more</span>';
    d.appendChild(s);
    // One quiet block of text: opening it animates in place and never scrolls
    // the thread. Long material scrolls inside the block instead.
    const panel=document.createElement("div");panel.className="src-panel";panel.setAttribute("role","region");
    const inner=document.createElement("div");
    const body=document.createElement("div");
    body.className="source-copy";
    body.textContent=rules.map(x=>typeof x==="string"?x:((x.label||"Course material")+(x.section?" · section "+x.section:"")+" — "+(x.excerpt||""))).join("\n\n");
    inner.appendChild(body);panel.appendChild(inner);d.appendChild(panel);
    s.onclick=()=>{const open=d.classList.toggle("open");s.setAttribute("aria-expanded",String(open));};
    return d;
  }

  function toolTitle(box,kind,title){
    const label=document.createElement("p");label.className="slabel mb-1";label.textContent=kind;
    const h=document.createElement("h3");h.className="tool-heading";h.textContent=title||kind;
    box.append(label,h);
  }
  function buildLearningTool(tool){
    const box=document.createElement("section");box.className="learning-tool toolkit-enter";
    if(tool.type==="quiz"){
      buildQuizTool(box,tool);
    }else if(tool.type==="flashcards"){
      buildFlashcardTool(box,tool);
    }else if(tool.type==="concept_map"){
      buildConceptMap(box,tool);

  // Concept map: each node carries its outgoing links as chips; a chip jumps to
  // and pulses the node it points at.

      n.querySelector("strong").textContent=node.label;n.querySelector("span").textContent=node.detail?" — "+node.detail:"";
      g.appendChild(n);
      const out=links.filter(l=>l.from===i&&nodes[l.to]);
      if(out.length){
        const row=document.createElement("div");row.className="map-links";
        out.forEach(l=>{
          const chip=document.createElement("button");chip.type="button";chip.className="map-chip";

    const paint=()=>{count.textContent=done+" of "+total+" reviewed";fill.style.setProperty("--p",(total?done/total*100:0)+"%");};
    box.append(tools,bar);

  // Counts a number up to its target so a result lands instead of just appearing.
  function countUp(el,target,total){
    if(reduceMotion){el.textContent=target+" / "+total;return;}
    let start=null;
    const tick=ts=>{
      if(start===null)start=ts;
      const p=Math.min(1,(ts-start)/800);
      el.textContent=Math.round(target*(1-Math.pow(1-p,3)))+" / "+total;
      if(p<1&&el.isConnected)requestAnimationFrame(tick);

  }

  function buildQuizTool(box,tool){
    const questions=(tool.questions||[]).filter(q=>q&&q.prompt&&Array.isArray(q.options)&&q.options.length>1);
    if(!questions.length){toolTitle(box,"Practice quiz",tool.title);return;}
    // `order` is the queue of question numbers being asked: all of them at first,
    // then only the missed ones after "Retry missed".
    let order=questions.map((q,i)=>i),index=0,advanceTimer=null,readingUntil=0,dir="next",finished=false;
    const answers=Array(questions.length).fill(null);
    const badge=toolHeader(box,"Practice quiz",tool.title,"Question 1 of "+questions.length);
    const setBar=toolBar(box);
    const stage=document.createElement("div");stage.className="tool-stage";box.appendChild(stage);
    const nav=document.createElement("div");nav.className="tool-nav";box.appendChild(nav);
    const previous=document.createElement("button");previous.type="button";previous.textContent="Previous";
    const next=document.createElement("button");next.type="button";

    const clearAdvance=()=>{if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null;}};
    const goNext=()=>{dir="next";if(index<order.length-1){index++;render();}else renderComplete();};
    const scheduleAdvance=()=>{
      clearAdvance();
      if(answers[order[index]]===null)return;
      const advance=()=>{
        if(document.hidden||Date.now()<readingUntil){advanceTimer=setTimeout(advance,900);return;}
        goNext();
      };
      advanceTimer=setTimeout(advance,5000);
    };
    // Answering re-renders in place (.still) so only the chosen option and the
    // feedback animate, not the whole question.
    const choose=optionIndex=>{

      const qn=order[index],question=questions[qn],answer=answers[qn];

      setBar(order.filter(q=>answers[q]!==null).length/order.length);
      const prompt=document.createElement("p");prompt.className="tool-prompt";prompt.textContent=question.prompt;stage.appendChild(prompt);
      const options=document.createElement("div");options.className="quiz-options";stage.appendChild(options);

        else feedback.textContent="Not quite. You can review this concept with AI at the end.";
        stage.appendChild(feedback);
      }

      next.textContent=index===order.length-1?"Finish":"Next";next.disabled=answer===null;next.className=answer===null?"":"primary";next.onclick=goNext;
      nav.append(previous,toolDots(order.length,index),next);

    const renderComplete=()=>{

      const label=document.createElement("p");label.className="slabel";label.textContent="Quiz complete";
      const scoreLine=document.createElement("div");scoreLine.className="tool-score";
      const copy=document.createElement("p");copy.textContent=score===questions.length?"Strong recall. Keep the ideas connected by explaining one in your own words.":"Your result is ready for a focused follow-up in this chat.";

        retry.onclick=()=>{order=missed.slice();missed.forEach(i=>{answers[i]=null;});index=0;dir="next";render();};actions.appendChild(retry);
      }
      complete.append(label,scoreLine,copy,recap,actions);stage.appendChild(complete);

    box.addEventListener("keydown",e=>{
      if(finished||e.ctrlKey||e.metaKey||e.altKey)return;
      const q=order[index];if(answers[q]!==null)return;

      if(/^[1-9]$/.test(e.key))i=+e.key-1;else if(/^[a-zA-Z]$/.test(e.key))i=e.key.toUpperCase().charCodeAt(0)-65;
      if(i>=0&&i<questions[q].options.length){e.preventDefault();choose(i);}
    });
    render();
  }

  function sendQuizReview(tool,questions,answers,score,button){
    if(navigationBusy||sending||toolRunning)return;
    const detail=questions.map((question,index)=>{
      const selected=answers[index]===null?"No answer":question.options[answers[index]];
      return "- Q"+(index+1)+": "+question.prompt+" | My answer: "+selected+" | Result: "+(answers[index]===question.answer?"correct":"needs review");
    }).join("\n");
    const summary="Quiz result summary\nActivity: "+(tool.title||"Practice quiz")+"\nScore: "+score+"/"+questions.length+"\n"+detail+"\nPlease identify the concepts I need to review, explain only what I missed, then give me one short targeted practice question.";
    button.disabled=true;button.textContent="Sending to AI…";els.input.value=summary;
    send().then(sent=>{button.disabled=!!sent;button.textContent=sent?"Sent to AI":"Review with AI";})
      .catch(()=>{button.disabled=false;button.textContent="Review with AI";});
  }

  function buildFlashcardTool(box,tool){
    const cards=(tool.cards||[]).filter(card=>card&&card.front&&card.back);
    if(!cards.length){toolTitle(box,"Flashcards",tool.title);return;}
    // `deck` is the queue of card numbers being studied; "Study remaining" narrows it.
    let deck=cards.map((c,i)=>i),index=0,flipped=false,dir="next",finished=false;
    const known=new Set(),again=new Set();

    const nav=document.createElement("div");nav.className="tool-nav";box.appendChild(nav);
    const flipLabel=()=>flipped?"Showing answer. Activate to show prompt.":"Showing prompt. Activate to reveal answer.";

    };
    const rate=kind=>{

    };

      finished=false;

      const front=document.createElement("span");front.className="flash-face front";const frontLabel=document.createElement("span");frontLabel.className="flash-label";frontLabel.textContent="Prompt";const frontText=document.createElement("strong");frontText.className="flash-text";frontText.textContent=data.front;const frontHint=document.createElement("span");frontHint.className="flash-hint";frontHint.textContent="";front.append(frontLabel,frontText,frontHint);
      const back=document.createElement("span");back.className="flash-face back";const backLabel=document.createElement("span");backLabel.className="flash-label";backLabel.textContent="Answer";const backText=document.createElement("strong");backText.className="flash-text";backText.textContent=data.back;const backHint=document.createElement("span");backHint.className="flash-hint";backHint.textContent="";back.append(backLabel,backText,backHint);
      card.append(front,back);
      const rating=document.createElement("div");rating.className="flash-rate";
      const againBtn=document.createElement("button");againBtn.type="button";againBtn.className="again";againBtn.textContent="Still learning";againBtn.onclick=()=>rate("again");
      const gotBtn=document.createElement("button");gotBtn.type="button";gotBtn.className="got";gotBtn.textContent="Got it";gotBtn.onclick=()=>rate("got");
      rating.append(againBtn,gotBtn);
      const syncRating=()=>{rating.classList.toggle("show",flipped);againBtn.disabled=gotBtn.disabled=!flipped;};
      syncRating();

        card.setAttribute("aria-pressed",String(flipped));card.setAttribute("aria-label",flipLabel());
        syncRating();
      };
      shell.appendChild(card);
      const tally=document.createElement("div");tally.className="flash-tally";
      tally.innerHTML="<span>Got it <b>"+known.size+"</b></span><span>Still learning <b>"+again.size+"</b></span>";
      const shuffle=document.createElement("button");shuffle.type="button";shuffle.textContent="Shuffle";
      shuffle.style.cssText="margin-left:auto;border:0;background:transparent;color:var(--c-sub);font:inherit;font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer";
      shuffle.onclick=()=>{
        for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
        index=0;flipped=false;dir="next";render();

      const previous=document.createElement("button");previous.type="button";previous.textContent="Previous";previous.disabled=index===0;previous.onclick=()=>go(-1);
      const next=document.createElement("button");next.type="button";next.textContent=index===deck.length-1?"Finish":"Next";next.onclick=()=>go(1);
      nav.append(previous,deck.length<=14?toolDots(deck.length,index):document.createElement("span"),next);
      if(hadFocus)card.focus({preventScroll:true});

    const renderComplete=()=>{
      finished=true;stage.replaceChildren();nav.replaceChildren();
      stage.dataset.dir="next";stage.classList.remove("still");badge.textContent="Complete";setBar(1);
      const remaining=cards.map((c,i)=>i).filter(i=>!known.has(i));
      const complete=document.createElement("div");complete.className="tool-complete";
      const label=document.createElement("p");label.className="slabel";label.textContent="Deck complete";
      const scoreLine=document.createElement("div");scoreLine.className="tool-score";
      const copy=document.createElement("p");
      copy.textContent=remaining.length?remaining.length+(remaining.length===1?" card is":" cards are")+" still worth another pass.":"You got every card. Try explaining a few from memory.";
      complete.append(label,scoreLine,copy);
      const actions=document.createElement("div");actions.className="tool-actions";
      if(remaining.length){
        const study=document.createElement("button");study.type="button";study.className="tool-review primary";study.textContent="Study remaining ("+remaining.length+")";
        study.onclick=()=>{deck=remaining.slice();index=0;flipped=false;dir="next";render();};actions.appendChild(study);
      }

      restart.onclick=()=>{known.clear();again.clear();deck=cards.map((c,i)=>i);index=0;flipped=false;dir="next";render();};actions.appendChild(restart);
      complete.appendChild(actions);stage.appendChild(complete);countUp(scoreLine,known.size,cards.length);

  }

  // Slides the finished status up and away before the activity takes its place.

  const sounds={

  // Only the unfinished block is reparsed. Finished blocks stay mounted, so
  // later chunks cannot change their wrapping or discard their text nodes.
  function createReplyStream(node){

    const tail=document.createElement("div");tail.className="stream-tail";
    tail.hidden=true;node.append(pending,tail);
    let source="",typed="",committed=0,typingTimer=null,finishResolve=null,finishRequested=false;
    function preview(src){
      const fences=src.match(/```/g)||[];

      const open=src.lastIndexOf("```");
      const before=src.slice(0,open);

        while((match=breaks.exec(visible))){
          const prefix=visible.slice(committed,match.index);
          if(((prefix.match(/```/g)||[]).length%2)===0)end=match.index+match[0].length;
        }
      }
      if(end>committed){tail.insertAdjacentHTML("beforebegin",renderMarkdown(visible.slice(committed,end)));committed=end;}
      if(final){pending.remove();tail.remove();}
      else{
        const remaining=visible.slice(committed);
        if(!remaining)tail.remove();
        else{tail.hidden=false;tail.innerHTML=preview(remaining);}
      }
      if(node.isConnected)scrollBottom();
    }
    function typeNext(){
      typingTimer=null;
      const backlog=source.length-typed.length;
      if(backlog>0){
        // A couple of characters per beat with a little randomness so it reads
        // as typing; speeds up only when the text is arriving faster than this.
        let count=reduceMotion?backlog:Math.max(1+Math.floor(Math.random()*3),Math.ceil(backlog/90));
        count=Math.min(count,backlog);
        const end=typed.length+count,code=source.charCodeAt(end-1);
        if(code>=0xD800&&code<=0xDBFF&&end<source.length)count++;
        pending.remove();
        typed+=source.slice(typed.length,typed.length+count);
        flush(false);
      }
      if(source.length>typed.length){
        let delay=reduceMotion?0:9+Math.random()*13;
        if(!reduceMotion&&source.length-typed.length<160){
          const last=typed.charAt(typed.length-1);
          if(/[.!?]/.test(last)&&Math.random()<.5)delay+=45;
          else if(/[,;:]/.test(last)&&Math.random()<.35)delay+=20;
        }
        typingTimer=setTimeout(typeNext,delay);return;
      }
      if(finishRequested){flush(true);if(finishResolve){finishResolve();finishResolve=null;}}
    }
    function scheduleTyping(){if(!typingTimer)typeNext();}
    return {
      push(chunk){if(chunk){source+=chunk;scheduleTyping();}},
      finish(text){
        if(text!==source){
          source=text;
          if(!source.startsWith(typed)){typed="";committed=0;node.replaceChildren(pending,tail);}
        }
        finishRequested=true;
        return new Promise(resolve=>{finishResolve=resolve;scheduleTyping();});
      },
      get text(){return source;}
    };
  }

  async function readChatResponse(res,onDelta){
    if(!res.ok){let error={};try{error=await res.json();}catch{}throw new Error(error.details||error.error||"Could not answer right now.");}
    if(!(res.headers.get("content-type")||"").includes("text/event-stream"))return res.json();
    const reader=res.body&&res.body.getReader();
    let buffer="",result=null;
    const consume=frame=>{
      for(const line of frame.split("\n")){
        if(!line.startsWith("data:"))continue;
        const item=JSON.parse(line.slice(5).trimStart());
        if(item.type==="delta")onDelta(item.text||"");
        if(item.type==="done")result=item.data;
        if(item.type==="error")throw new Error(item.message||"Reply interrupted.");
      }
    };
    if(!reader){
      (await res.text()).replace(/\r\n/g,"\n").split("\n\n").forEach(consume);
      if(!result)throw new Error("Reply interrupted. Please try again.");
      return result;
    }
    const decoder=new TextDecoder();
    while(true){
      const {done,value}=await reader.read();
      buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});
      buffer=buffer.replace(/\r\n/g,"\n");
      let split;
      while((split=buffer.indexOf("\n\n"))!==-1){
        const frame=buffer.slice(0,split);buffer=buffer.slice(split+2);
        consume(frame);
      }
      if(done)break;
    }
    if(!result)throw new Error("Reply interrupted. Please try again.");
    return result;
  }

  // Bumped whenever the view moves to a different conversation. Anything still
  // in flight compares the token it captured against this before touching the
  // DOM: without it a finished quiz would call replaceWith() on a node that
  // renderMessages had already thrown away, and vanish silently.
  let VIEW_GEN=0,toolAbort=null;
  function invalidateView(){ VIEW_GEN++;stopSound();if(toolAbort){toolAbort.abort();toolAbort=null;} }

  // One status record follows the request through success, failure, or stop.
  async function runTool(request,chat,anchor){
    if(toolRunning)return;
    toolRunning=true;updateComposer();
    const gen=VIEW_GEN;
    const status=buildToolProgress(request);
    chat.messages.push(status);
    let progress,stopped=false;
    const controller=new AbortController();toolAbort=controller;
    status.cancel=()=>{
      stopped=true;controller.abort();stopSound();
      status.state="canceled";status.text="Stopped on this device.";
      if(progress.isConnected)progress.replaceWith(progress=buildToolStatus(status));
    };
    progress=buildToolStatus(status);anchor.appendChild(progress);scrollBottom();playSound("using");
    try{
      const res=await Chronos.apiFetch("/tools/run",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({class_id:chat.classId||ACTIVE_CLASS,chat_id:chat.id,tool_request:request}),
        signal:controller.signal});
      let data={};
      try{ data=await res.json(); }catch(e){ data={}; }
      if(stopped||gen!==VIEW_GEN){
        status.state="canceled";status.text="Stopped on this device.";
        return;
      }
      if(!res.ok||data.error||!data.tool)throw new Error(data.error||"Couldn’t create that activity.");
      const msg={role:"teacher",content:"",tool:data.tool,sources:data.sources||[]};
      msg._toolEl=buildLearningTool(data.tool);
      chat.messages=chat.messages.filter(item=>item!==status);
      chat.messages.push(msg);
      status.state="done";status.text=(TOOL_LABELS[request.type]||"Activity")+" ready";
      progress.replaceWith(progress=buildToolStatus(status));playSound("done");
      await new Promise(resolve=>setTimeout(resolve,reduceMotion?0:550));
      if(gen===VIEW_GEN&&progress.isConnected){
        await dismissStatus(progress);
        if(gen===VIEW_GEN&&progress.isConnected)progress.replaceWith(msg._toolEl);
      }
    }catch(err){
      if(stopped||gen!==VIEW_GEN||(err&&err.name==="AbortError")){
        if(status.state==="using"){status.state="canceled";status.text="Stopped on this device.";}
        stopSound();return;
      }
      status.state="failed";status.text=(err&&err.message)||"Couldn’t create that activity.";
      if(progress.isConnected)progress.replaceWith(progress=buildToolStatus(status));
      playSound("failed");
    }finally{
      if(toolAbort===controller)toolAbort=null;
      toolRunning=false;updateComposer();
      if(gen===VIEW_GEN)scrollBottom();
    }
  }

  async function send(options={}){
    if(navigationBusy||sending||toolRunning)return;
    const text=els.input.value.trim();if(!text)return;
    if(!activeChat())await newChat();
    const c=activeChat();
    if(!c)return;
    c.messages.push({role:"student",content:text});
    if(c.messages.length===1){c.title=text.length>30?text.slice(0,30)+"…":text;renderSidebar();}
    els.input.value="";c.draft="";els.input.style.height="auto";
    renderMessages();
    // renderMessages rebuilds quietly; only the message just sent should move in.
    if(els.messagesInner.lastElementChild)els.messagesInner.lastElementChild.classList.add("enter");
    setSending(true);
    const tm={role:"teacher",content:"",rules:[],sources:[],tool:null};c.messages.push(tm);
    const el=buildMsgEl(tm);el.classList.add("enter");els.messagesInner.appendChild(el);
    const b=el.querySelector(".ai-prose"),stream=createReplyStream(b);scrollBottom();
    let reachedServer=false;
    const tSent=performance.now();let tFirst=0;
    try{
      // The tutor answers from this chat's class. Omit chat_id for a not-yet-saved
      // conversation; the server creates one.
      const body={message:text,class_id:c.classId||ACTIVE_CLASS,chat_id:c.id,stream:true};
      if(DEBUG)body.debug=true;
      const res=await Chronos.apiFetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      reachedServer=true;setStatus("online");
      const data=await readChatResponse(res,chunk=>{if(!tFirst)tFirst=performance.now();tm.content+=chunk;stream.push(chunk);});
      if(data.error)throw new Error(data.details||data.error);
      if(DEBUG&&data.debug){
        tm.debug=Object.assign({},data.debug,{client:{first_delta_ms:tFirst?Math.round(tFirst-tSent):null,done_ms:Math.round(performance.now()-tSent),
          cache_hit_chats:ALL_CHATS.filter(x=>x.loaded).length}});
      }
      // Adopt the server's chat id/title for a freshly-created conversation.
      if(data.chat_id&&c.isNew){const oldId=c.id;c.id=data.chat_id;c.isNew=false;c.loaded=true;if(data.title)c.title=data.title;if(activeChatId===oldId)activeChatId=c.id;renderSidebar();}
      // `grounded` comes from the server, which is the only side that can see
      // the sources: students are never sent rules_used, so an empty list here
      // no longer means "nothing backed this answer".
      const streamedText=stream.text;
      tm.content=data.response||streamedText;tm.rules=data.rules_used||[];tm.sources=data.sources||[];
      tm.reviewed=!!data.reviewed;tm.blocked=!!data.blocked;
      tm.gap=!!data.material_gap&&!tm.reviewed&&!tm.blocked;
      if(c.id!==activeChatId){setSending(false);return true;}
      if(Array.isArray(data.toolkits)){TOOLKITS=data.toolkits;renderToolMenu();}
      const gen=VIEW_GEN;
      await stream.finish(streamedText.trim()===tm.content?streamedText:tm.content);
      if(tm.gap)el.appendChild(gapNote());
      if(tm.reviewed)el.appendChild(reviewedNote());
      const sources=IS_TEACHER?(tm.sources.length?tm.sources:tm.rules):[];
      if(sources.length)el.appendChild(buildSourcesDropdown(sources));
      if(tm.debug){el.appendChild(buildDebugPanel(tm.debug));paintDebugStrip(tm.debug);}
      if(gen===VIEW_GEN&&(data.tool_request||(options.requestedTool&&!data.blocked)))
        await runTool(data.tool_request||options.requestedTool,c,el);
      if(gen===VIEW_GEN)scrollBottom();
      setSending(false);
      return true;
    }catch(err){
      if(!reachedServer)setStatus("offline");
      const message=(err&&err.message)||"Can't reach the server. Please try again.";
      const partial=stream.text;
      tm.content=partial?partial+"\n\n"+message:message;
      await stream.finish(partial||message);
      if(partial){
        const note=document.createElement("p");note.className="mt-3.5 text-primary text-[13.5px] leading-relaxed";
        note.textContent=message;el.appendChild(note);
      }
      setSending(false);
      return false;
    }
  }

  async function checkServer(){

    // erroring meanwhile. Retry a few times and show "Waking…" so a sleeping-but-

    for(let i=0;i<3;i++){

  // The on-screen keyboard doesn't resize the layout viewport, so the composer
  // ends up behind it and the last message with it. visualViewport is the only
  // thing that reports the keyboard, so track it and keep the thread pinned.
  (function keyboardAware(){
    const vv=window.visualViewport;
    if(!vv)return;
    const atBottom=()=>els.messages.scrollHeight-els.messages.scrollTop-els.messages.clientHeight<120;
    let wasAtBottom=true;
    els.messages.addEventListener("scroll",()=>{wasAtBottom=atBottom();},{passive:true});
    const pin=()=>{if(wasAtBottom)els.messages.scrollTop=els.messages.scrollHeight;};
    vv.addEventListener("resize",pin);
    els.input.addEventListener("focus",()=>{
      wasAtBottom=true;
      // After the keyboard has actually animated in — before that the viewport
      // hasn't changed yet and scrolling lands in the wrong place.
      setTimeout(()=>{pin();els.input.scrollIntoView({block:"nearest"});},300);
    });
  })();

  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$s("joinGate").classList.contains("hidden"))hideJoinGate();});
  // Codes are case-insensitive and often pasted with spaces or dashes.
  $s("joinCodeInput").addEventListener("input",e=>{e.target.value=e.target.value.replace(/[^a-z0-9]/gi,"").toUpperCase();$s("joinErr").classList.add("hidden");});
  $s("joinCodeInput").addEventListener("keydown",e=>{if(e.key==="Enter")submitJoin();});

  function paintClassSwitcher(){
    const sel=$s("classSwitcher");sel.innerHTML="";
    CLASSES.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
    if(ACTIVE_CLASS)sel.value=ACTIVE_CLASS;
  }

  // Load classes; returns true if the student is in at least one.
  async function loadClasses(pending){
    const result=pending?await pending:null;
    if(result&&result.error)throw result.error;
    CLASSES=result?result.value:await Chronos.listClasses();
    let pick=localStorage.getItem(CLASS_KEY);
    if(!CLASSES.find(c=>c.id===pick))pick=CLASSES.length?CLASSES[0].id:null;
    ACTIVE_CLASS=pick;
    if(ACTIVE_CLASS)localStorage.setItem(CLASS_KEY,ACTIVE_CLASS);
    syncToolkits();
    paintClassSwitcher();
    return CLASSES.length>0;
  }

  // Whatever the active course allows. /chat refreshes this on every answer;
  // this seeds it so practice is offered on a page the student just opened.
  function syncToolkits(){
    const c=CLASSES.find(x=>x.id===ACTIVE_CLASS);
    TOOLKITS=(c&&Array.isArray(c.toolkits))?c.toolkits:[];
    renderToolMenu();
  }

  async function switchClass(id){
    if(!id||id===ACTIVE_CLASS)return;
    let target=ALL_CHATS.find(c=>c.classId===id);
    if(!target){
      target={id:tempId(),title:"New chat",classId:id,messages:[],loaded:true,isNew:true};
      ALL_CHATS.unshift(target);
    }
    const switched=await selectChat(target.id,id);
    if(!switched)paintClassSwitcher();
  }

  // Show only the active class's conversations.
  async function applyClassFilter(){
    const available=ALL_CHATS.filter(c=>c.classId===ACTIVE_CLASS);
    if(available.length)return selectChat(available[0].id);
    const blank={id:tempId(),title:"New chat",classId:ACTIVE_CLASS,messages:[],loaded:true,isNew:true};
    ALL_CHATS.unshift(blank);
    return selectChat(blank.id);
  }

  // Load this student's saved conversations (all classes) from the server.
  async function loadChats(pending){
    try{
      const result=pending?await pending:null;
      if(result&&result.error)throw result.error;
      const d=result?result.data:await Chronos.apiJson("/chats",undefined,"GET");
      const retained=new Map(ALL_CHATS.map(c=>[c.id,c]));
      const saved=(d.chats||[]).map(c=>{
        const local=retained.get(c.id);
        return local?Object.assign(local,{title:c.title,classId:c.class_id}):
          {id:c.id,title:c.title,classId:c.class_id,messages:[],loaded:false,isNew:false};
      });
      ALL_CHATS=saved.concat(ALL_CHATS.filter(c=>c.isNew&&!saved.includes(c)));
    }catch(e){
      if(!ALL_CHATS.length)throw new Error("Could not load conversations. Please refresh and try again.");
      fileErr("Could not refresh conversations. Please try again.");
    }
    if(!(await applyClassFilter()))throw new Error("Could not open a conversation. Please try again.");
    // Quietly fetch the few most recent conversations so opening one is instant.
    ALL_CHATS.filter(c=>c.classId===ACTIVE_CLASS).slice(0,4).forEach(warmChat);
  }

  // ---- the student's own work (assignment + rubric) ----
  // The server keys these by class, so this list is swapped on every class switch
  // exactly like the conversations are: nothing a student attaches follows them
  // into another class.
  let FILES=[],FILE_MAX=3,PENDING_KIND=null,PENDING_FILE=null;

  function fileErr(msg){
    const el=$s("fileErr");el.textContent=msg||"";
    $s("fileBar").hidden=!msg&&!FILES.length;
    if(msg)setTimeout(()=>{if(el.textContent===msg){el.textContent="";$s("fileBar").hidden=!FILES.length;}},7000);
  }

  function renderFiles(){
    const box=$s("fileChips");box.innerHTML="";
    FILES.forEach(f=>{
      const chip=document.createElement("span");chip.className="file-chip";
      const icon=document.createElement("span");
      icon.className="material-symbols-outlined text-[15px] flex-shrink-0";
      icon.textContent=f.kind==="rubric"?"checklist":"description";
      const nm=document.createElement("span");nm.className="nm";
      // textContent, not innerHTML: this filename came off the student's disk.
      nm.textContent=f.name;nm.title=f.kind+": "+f.name;
      const x=document.createElement("button");x.title="Remove";
      x.innerHTML='<span class="material-symbols-outlined text-[15px]">close</span>';
      x.onclick=()=>removeFile(f.id);
      chip.appendChild(icon);chip.appendChild(nm);chip.appendChild(x);
      box.appendChild(chip);
    });
    $s("fileBar").hidden=!FILES.length&&!$s("fileErr").textContent;
    updateComposer();
  }

  async function fetchFiles(c){
    if(c.filesLoaded)return {files:c.files,max:FILE_MAX};
    // A locally created conversation has no server-side attachments until an
    // upload succeeds. Keep its in-memory files and skip an empty Firestore read.
    if(c.isNew)return {files:c.files||[],max:FILE_MAX};
    const d=await Chronos.apiJson("/student/files?class_id="+encodeURIComponent(c.classId)+"&chat_id="+encodeURIComponent(c.id),undefined,"GET");
    return {files:d.files||[],max:d.max};
  }

  async function uploadFile(kind,file){
    const chat=activeChat(),classId=ACTIVE_CLASS;
    if(!chat||!classId)return;
    const fd=new FormData();
    fd.append("class_id",classId);fd.append("chat_id",chat.id);fd.append("kind",kind);fd.append("file",file);
    $s("addFileBtn").disabled=true;
    fileErr("Reading "+file.name+"…");
    try{
      // No Content-Type header: FormData has to set its own multipart boundary.
      const res=await Chronos.apiFetch("/student/files",{method:"POST",body:fd});
      let d={};try{d=await res.json();}catch(e){}
      if(!res.ok||d.error){if(chat===activeChat())fileErr(d.error||"Could not attach that file.");renderFiles();return;}
      chat.files=chat.files||[];
      chat.files.push({id:d.id,name:d.name,kind:d.kind});
      if(chat===activeChat()){FILES=chat.files;fileErr(d.warning||"");}
    }catch(e){if(chat===activeChat())fileErr("Can’t reach the server.");}
    renderFiles();
  }

  async function removeFile(id){
    const chat=activeChat();if(!chat)return;
    try{await Chronos.apiJson("/student/files/"+encodeURIComponent(id),undefined,"DELETE");}
    catch(e){fileErr((e&&e.message)||"Could not remove that file.");return;}
    chat.files=(chat.files||[]).filter(f=>f.id!==id);
    if(chat===activeChat()){FILES=chat.files;renderFiles();}
  }

  $s("addFileBtn").onclick=()=>{renderAddFileMenu(null);openComposerMenu("addFileMenu");};
  $s("toolBtn").onclick=()=>openComposerMenu("toolMenu");
  document.addEventListener("click",e=>{
    if(!e.target.closest("#addFileMenu,#toolMenu,#addFileBtn,#toolBtn"))closeComposerMenus();
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeComposerMenus();});
  $s("fileInput").onchange=e=>{
    const f=e.target.files&&e.target.files[0];
    if(f&&PENDING_KIND==="file"){
      renderAddFileMenu(f);openComposerMenu("addFileMenu");PENDING_FILE=f;
    }else if(f&&PENDING_KIND)uploadFile(PENDING_KIND,f);
    PENDING_KIND=null;
  };

  // The join dialog can be dismissed only when there is a course to go back to.
  // With none, it is the whole app, so it offers a sign-out for the wrong account
  // (worded as "Not you?", and never next to a Close button it could be mistaken for).
  function showJoinGate(){
    const dismissible=CLASSES.length>0;
    $s("joinErr").classList.add("hidden");
    $s("joinCodeInput").value="";
    $s("joinCancelBtn").classList.toggle("hidden",!dismissible);
    $s("joinFoot").classList.toggle("hidden",dismissible);
    $s("joinEmail").textContent=(USER&&USER.email)||(Chronos.hint()||{}).email||"";
    $s("joinGate").classList.remove("hidden");
    $s("joinCodeInput").focus();
  }
  function hideJoinGate(){
    if(!CLASSES.length)return;
    $s("joinGate").classList.add("hidden");
  }

  // Teachers own classes — they should never be asked to *join* one with a code.
  // If a teacher reaches the tutor without a class, point them at Course Material
  // to create one instead of showing the student join-code box.
  function showTeacherNoClassGate(){
    $s("teacherGateEmail").textContent=(USER&&USER.email)||"";
    $s("teacherGateLogout").onclick=signOut("teacher");
    $s("teacherGate").classList.remove("hidden");
  }

  async function submitJoin(){
    const code=$s("joinCodeInput").value.trim().toUpperCase();
    const showErr=m=>{$s("joinErr").textContent=m;$s("joinErr").classList.remove("hidden");};
    if(!code){showErr("Enter a course code.");return;}
    $s("joinBtn").disabled=true;
    try{
      const cls=await Chronos.joinClass(code);
      ACTIVE_CLASS=cls.id;localStorage.setItem(CLASS_KEY,cls.id);
      await loadClasses();
      ACTIVE_CLASS=cls.id;localStorage.setItem(CLASS_KEY,cls.id);paintClassSwitcher();
      await loadChats();
      hideJoinGate();
    }catch(e){
      showErr((e&&e.message)||"That code didn't work. Check it and try again.");
    }
    $s("joinBtn").disabled=false;
  }

  function paintUser(email,role){
    const em=$s("userEmail");em.textContent=email||"Account";em.title=email||"";
    $s("userInitials").textContent=(email||"?").slice(0,2).toUpperCase();
    // A teacher trying the tutor isn't a student.
    $s("roleLabel").textContent=role==="teacher"?"Teacher":"Student";
    // Show a way back to the teacher panels when a teacher is using the tutor.
    $s("teacherBackLink").classList.toggle("hidden",role!=="teacher");
    $s("teacherBackLink").classList.toggle("flex",role==="teacher");
  }
  function applyDebugUi(){
    $s("composerBox").classList.toggle("debug-on",DEBUG);
    $s("dbgStrip").classList.toggle("on",DEBUG);
    if(DEBUG&&!$s("dbgStrip").textContent)$s("dbgStrip").innerHTML="<b>DEBUG</b> on · send a message to see the report";
  }
  function showPageError(message){
    const wrap=document.createElement("p");
    wrap.className="font-body-md text-body-md text-error text-center px-6 py-10";
    wrap.textContent=message||"Sign-in required";   // textContent: this string comes off the wire
    els.messagesInner.replaceChildren(wrap);
    const skel=$s("chatSkel");if(skel)skel.remove();
  }

  // Paint the shell at once from the last verified sign-in, so there is no blank
  // "checking who you are" screen. requireRole() confirms it in parallel, and if
  // the session is stale it sends the user back to sign in as before.
  const hinted=Chronos.hint();
  if(hinted)paintUser(hinted.email,hinted.role);

  // Start the data requests the moment a session exists, without waiting for the
  // role check. The server authorizes each of them itself.
  const early=Chronos.whenSignedIn().then(()=>({
    classes:Chronos.listClasses().then(value=>({value}),error=>({error})),
    chats:Chronos.apiJson("/chats",undefined,"GET").then(data=>({data}),error=>({error})),
  }));

  // Teachers can use the tutor too, so both roles are allowed here (the backend
  // /chat accepts any signed-in user).
  Chronos.requireRole(["student","teacher"]).then(async(info)=>{
    USER=info;
    IS_TEACHER=info.role==="teacher";
    IS_DEV=!!info.is_dev;
    DEBUG=IS_DEV&&localStorage.getItem("chronos-debug")==="1";
    paintUser(info.email,info.role);
    applyDebugUi();
    const started=await early;
    const hasClass=await loadClasses(started.classes);
    if(!hasClass){
      const skel=$s("chatSkel");if(skel)skel.remove();
      info.role==="teacher"?showTeacherNoClassGate():showJoinGate();
    }else await loadChats(started.chats);
    checkServer();setInterval(checkServer,15000);
  }).catch(e=>showPageError((e&&e.message)||"Something went wrong. Please refresh."));
</script>

<!-- How-it-works tutorial -->
<div class="hidden fixed inset-0 z-[60] flex items-center justify-center p-margin-mobile" style="background:rgba(11,11,12,.72)" id="tut">
<div class="w-full max-w-md bg-surface-container-lowest hard cast-red p-stack-lg max-h-[85dvh] overflow-y-auto">
<div class="flex items-start justify-between gap-3 mb-stack-md">
<h2 class="font-headline-md text-headline-md text-on-background" id="tutTitle"></h2>
<button class="ibtn flex-shrink-0" id="tutClose"><span class="material-symbols-outlined">close</span></button>
</div>
<div class="space-y-stack-md" id="tutBody"></div>
<div class="flex items-center justify-center gap-1.5 mt-stack-md" id="tutDots"></div>
<button class="kbtn w-full mt-stack-lg" id="tutDone"><span>Continue</span></button>
</div>
</div>
<script>
  (function(){
    const TITLE="Quick tour";
    const KEY="chronos_tut_student_v2";
    const STEPS=[
      {icon:"school",title:"Pick your course",text:"The menu on the left sets which course the tutor answers from."},
      {icon:"forum",title:"Just ask",text:"Type a question and press Enter. Attach an assignment or rubric with + to get feedback on your own work."},
      {icon:"auto_awesome",title:"Practice",text:"When your teacher turns them on, quizzes and flashcards are in the sparkle menu."},
    ];
    let idx=0;
    const body=document.getElementById("tutBody");
    const dots=document.getElementById("tutDots");
    const doneBtn=document.getElementById("tutDone");
    document.getElementById("tutTitle").textContent=TITLE;

    function render(){
      const s=STEPS[idx];
      body.innerHTML='<div class="flex items-start gap-3">'+
        '<span class="w-10 h-10 flex-shrink-0 bg-primary text-on-primary flex items-center justify-center"><span class="material-symbols-outlined text-[20px]">'+s.icon+'</span></span>'+
        '<div><h3 class="font-label-md text-label-md text-on-surface mb-0.5" style="font-family:\'Schibsted Grotesk\',sans-serif;text-transform:none">'+s.title+'</h3>'+
        '<p class="font-body-md text-body-md text-on-surface-variant leading-snug">'+s.text+'</p></div></div>';
      dots.innerHTML="";
      STEPS.forEach((_,i)=>{
        const d=document.createElement("span");
        d.className="h-2 transition-all "+(i===idx?"w-6 bg-primary":"w-2 bg-outline");
        dots.appendChild(d);
      });
      doneBtn.querySelector("span").textContent = idx===STEPS.length-1 ? "Got it" : "Continue";
    }

    const modal=document.getElementById("tut");
    const open=()=>{idx=0;render();modal.classList.remove("hidden");};
    const close=()=>{modal.classList.add("hidden");try{localStorage.setItem(KEY,"1");}catch(e){}};
    document.getElementById("tutClose").onclick=close;
    // Each click only ever advances one step — no skipping ahead, and no
    // dismissing by clicking the backdrop, so the steps actually get read.
    doneBtn.onclick=()=>{ if(idx<STEPS.length-1){idx++;render();} else {close();} };
    const help=document.getElementById("tutHelp");if(help)help.onclick=open;
    // Opt-in: Settings → Account → Replay tour. It no longer opens by itself.
    window.__tutOpen=open;
  })();
</script>
</body></html>
