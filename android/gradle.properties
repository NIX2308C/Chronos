android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The site the app opens. Overridden per build with -PtwaHost=<host>, which is
# what the GitHub Actions workflow does, so pointing the app at the real
# deployment never needs a commit.
#
# .invalid is reserved by RFC 2606 and can never resolve, so a build that
# forgot to set the host fails visibly rather than silently shipping something
# that looks plausible.
twaHost=chronos-not-deployed-yet.invalid
