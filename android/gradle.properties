android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# The backend the app talks to. Overridden per build with -PchronosHost=<host>,
# so building against staging never needs a commit.
chronosHost=chronos.tevproject.com

# Firebase Auth (email/password only). These two are public by design — app.py
# serves them unauthenticated at /auth/config, and a Web API key is not a secret.
fbApiKey=AIzaSyCF-Zbb_JReyEm3m_WyH0kcyw1LcgVukO8
fbProjectId=teacheraifrontend

# The Android app id from the Firebase console (Project settings > Your apps >
# Add app > Android, package name com.chronos.tutor). Looks like
# 1:123456789012:android:abcdef0123456789. No SHA-1 is needed for
# email/password auth. Until this is filled in, sign-in will fail at runtime.
fbAppId=
