<style>
    /* Custom components use these vars so they follow the theme on their own;
       theme.css only has to repoint the Tailwind-generated utility classes. */
    :root{--c-page:#E9E4D6;--c-paper:#F7F4EC;--c-ink:#141311;--c-sub:#5D5B55;--c-edge:#1C1A16;
          --c-hi:#E4DECD;--c-rule:#DED8C6;--crimson:#E2001A;--gold:#C9A227;
          --snap:cubic-bezier(.2,1.45,.35,1)}
    html.dark{--c-page:#0B0B0C;--c-paper:#141317;--c-ink:#F7F4EC;--c-sub:#A9A499;--c-edge:#3A3A3E;
              --c-hi:#1E1E23;--c-rule:#2E2E33;color-scheme:dark}

    body { font-family: 'Schibsted Grotesk', sans-serif; }
    h1,h2,h3,h4 { font-family: 'Newsreader', serif; font-weight:400; letter-spacing: -.015em; }
    ::selection { background: var(--crimson); color: #F7F4EC; }
    :focus-visible { outline: 2px solid var(--crimson); outline-offset: 2px; }
    .material-symbols-outlined { font-family: 'Material Symbols Sharp'; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
    .mono { font-family: 'Schibsted Grotesk', sans-serif; }
    /* Custom classes below set `display`, which would beat Tailwind's .hidden on a
       tie. Scope the fix to those classes — a blanket `.hidden{display:none!important}`
       also outranks `md:flex`/`sm:inline`, which permanently hides every element that
       is meant to appear only at a breakpoint (e.g. the sidebar). */
    .hidden.kbtn, .hidden.ibtn, .hidden.chat-row { display:none; }
    .tagline { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }

    .chat-scroll::-webkit-scrollbar { width: 8px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background-color: var(--c-edge); }

    .spin { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* typing cursor */
    .cursor { display:inline-block; width:8px; height:1rem; background:var(--crimson); margin-left:2px; vertical-align:text-bottom; animation:blink 1s steps(2) infinite; }
    @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

    /* ---- shared shapes ---- */
    .hard { border:1px solid var(--c-rule); }
    .cast { }
    .cast-red { border-color:var(--crimson) !important; }

    /* ---- message bubbles ---- */
    .bub-you { max-width:78%; background:var(--crimson); color:#F7F4EC; padding:12px 16px;
        font-size:15.5px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere;
        animation:pop .32s var(--snap) both }
    /* The answer is the page, not a card in it: plain serif on the paper, no
       chrome around it. Only the question gets a bubble. */
    .bub-ai { color:var(--c-ink); font-family:'Newsreader',serif; font-size:19px; line-height:1.62;
        overflow-wrap:anywhere }
    @keyframes pop { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }

    /* ---- sidebar conversation rows ---- */
    .chat-row { display:flex; align-items:center; border-left:3px solid transparent; color:var(--c-sub);
        transition:background-color .18s ease,border-color .2s var(--snap),color .18s ease }
    .chat-row:hover { background:var(--c-hi); color:var(--c-ink) }
    .chat-row.on { background:var(--c-hi); border-left-color:var(--crimson); color:var(--c-ink) }

    /* ---- buttons ---- */
    .kbtn { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
        font-size:14px; font-weight:600; padding:.85rem 1rem; border:1px solid var(--crimson); background:var(--crimson);
        color:#F7F4EC; cursor:pointer; transition:background-color .15s ease,border-color .15s ease }
    .kbtn:hover:not(:disabled) { background:var(--c-ink); border-color:var(--c-ink) }
    .kbtn:disabled { opacity:.55; cursor:default }
    .kbtn-ghost { background:transparent; border-color:var(--c-rule); color:var(--c-ink) }
    .kbtn-ghost:hover:not(:disabled) { color:var(--c-ink); border-color:var(--c-ink); background:transparent }

    .ibtn { width:34px; height:34px; display:flex; align-items:center; justify-content:center;
        border:1px solid transparent; color:var(--c-sub);

    .ibtn:hover { background:var(--crimson); border-color:var(--crimson); color:#F7F4EC }

    .slabel { font-size:12.5px; font-weight:600; color:var(--c-sub) }
    .sendbtn { width:40px; height:40px; flex:none; display:flex; align-items:center; justify-content:center;

    .sendbtn:hover:not(:disabled) { background:var(--crimson); color:#F7F4EC }
    .sendbtn:disabled { opacity:.4; cursor:default }

    /* empty-state starter questions */
    .starter { display:flex; align-items:center; justify-content:space-between; gap:1rem; width:100%;
        text-align:left; background:transparent; border:none; border-bottom:1px solid var(--c-rule);

        transition:color .15s ease }
    .starter:hover { color:var(--crimson) }

    /* ---- input bar ---- */
    .composer { background:var(--c-paper); border:1px solid var(--c-rule); transition:border-color .15s ease }
    .composer:focus-within { border-color:var(--crimson) }

    .fld { background:var(--c-paper); border:1px solid var(--c-rule); color:var(--c-ink); border-radius:0;
        transition:border-color .15s }
    .fld:focus { outline:none; border-color:var(--crimson) }

    /* ---- teacher-only "Sources used" dropdown ---- */
    .src-drop summary { list-style: none; }
    .src-drop summary::-webkit-details-marker { display: none; }
    .src-drop[open] .chev { transform: rotate(180deg); }
    .src-drop { border:1px solid var(--gold); background:var(--c-paper); color:var(--c-ink) }

    /* ---- markdown inside AI bubbles ---- */
    .ai-prose p { margin:0 0 .75rem; }
    .ai-prose p:last-child, .ai-prose ul:last-child, .ai-prose ol:last-child, .ai-prose pre:last-child { margin-bottom:0; }
    .ai-prose ul { list-style:square; padding-left:1.25rem; margin:0 0 .75rem; }
    .ai-prose ol { list-style:decimal; padding-left:1.25rem; margin:0 0 .75rem; }
    .ai-prose li { margin:.25rem 0; }
    .ai-prose li::marker { color:var(--crimson); }
    .ai-prose strong { font-weight:700; }
    .ai-prose em { font-style:italic; }
    .ai-prose h1,.ai-prose h2,.ai-prose h3 { font-family:'Schibsted Grotesk',sans-serif; text-transform:none;
        font-weight:700; line-height:1.3; margin:.85rem 0 .45rem; letter-spacing:0; }
    .ai-prose h1:first-child,.ai-prose h2:first-child,.ai-prose h3:first-child { margin-top:0; }
    .ai-prose h1 { font-size:1.25rem; } .ai-prose h2 { font-size:1.1rem; } .ai-prose h3 { font-size:1rem; }
    .ai-prose a { color:var(--crimson); text-decoration:underline; text-underline-offset:2px; }
    .ai-prose code { font-family:ui-monospace,monospace; font-size:.86em; background:var(--c-hi); border:1px solid var(--c-rule); padding:1px 5px; }
    .ai-prose pre { background:var(--c-hi); border:1px solid var(--c-rule); padding:.75rem; overflow-x:auto; margin:.6rem 0; }
    .ai-prose pre code { background:none; border:none; padding:0; font-size:.8rem; line-height:1.55; display:block; color:var(--c-ink); }
    .ai-prose blockquote { border-left:4px solid var(--crimson); padding-left:.75rem; margin:.6rem 0; color:var(--c-sub); }

    @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<script>
  // Backend base (same-origin in deployment; dev server via Live Server/file://).
  // Chronos.BASE comes from auth.js and uses the same detection.
  const API_BASE=Chronos.BASE;

  // --- tiny self-contained markdown renderer (bold, italics, lists, code, headings, links) ---
  // Quotes are escaped too: mdInline drops a matched URL straight into href="…",
  // so anything reaching an attribute has to be quote-safe. Today the URL pattern
  // forbids whitespace and can't start a second attribute, but that's one regex
  // tweak away from being live XSS in model output.
  function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function mdInline(s){
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    s=s.replace(/__(.+?)__/g,"<strong>$1</strong>");
    s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
    s=s.replace(/(^|[^_\w])_([^_\n]+)_/g,"$1<em>$2</em>");
    return s;
  }
  function renderMarkdown(src){
    const NUL=String.fromCharCode(0),blocks=[],inls=[];
    let text=String(src).replace(/\r\n/g,"\n");
    text=text.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{blocks.push(escapeHtml(code.replace(/\n+$/,"")));return NUL+"CB"+(blocks.length-1)+NUL;});
    text=escapeHtml(text);
    text=text.replace(/`([^`\n]+)`/g,(m,code)=>{inls.push(code);return NUL+"IC"+(inls.length-1)+NUL;});
    const lines=text.split("\n");let html="",i=0;
    const isUL=l=>/^\s*[\-\*\+]\s+/.test(l),isOL=l=>/^\s*\d+\.\s+/.test(l),isH=l=>/^#{1,6}\s+/.test(l),isQ=l=>/^>\s?/.test(l),isCB=l=>new RegExp("^"+NUL+"CB\\d+"+NUL+"$").test(l);
    while(i<lines.length){
      let line=lines[i];
      if(/^\s*$/.test(line)){i++;continue;}
      if(isCB(line)){const n=line.match(/CB(\d+)/)[1];html+="<pre><code>"+blocks[+n]+"</code></pre>";i++;continue;}
      let h=line.match(/^(#{1,6})\s+(.*)$/);
      if(h){const lv=Math.min(h[1].length,3);html+="<h"+lv+">"+mdInline(h[2])+"</h"+lv+">";i++;continue;}
      if(isQ(line)){let buf=[];while(i<lines.length&&isQ(lines[i])){buf.push(lines[i].replace(/^>\s?/,""));i++;}html+="<blockquote>"+mdInline(buf.join("<br>"))+"</blockquote>";continue;}
      if(isUL(line)){let buf="";while(i<lines.length&&isUL(lines[i])){buf+="<li>"+mdInline(lines[i].replace(/^\s*[\-\*\+]\s+/,""))+"</li>";i++;}html+="<ul>"+buf+"</ul>";continue;}
      if(isOL(line)){let buf="";while(i<lines.length&&isOL(lines[i])){buf+="<li>"+mdInline(lines[i].replace(/^\s*\d+\.\s+/,""))+"</li>";i++;}html+="<ol>"+buf+"</ol>";continue;}
      let buf=[];
      while(i<lines.length&&!/^\s*$/.test(lines[i])&&!isH(lines[i])&&!isQ(lines[i])&&!isUL(lines[i])&&!isOL(lines[i])&&!isCB(lines[i])){buf.push(lines[i]);i++;}
      html+="<p>"+mdInline(buf.join("<br>"))+"</p>";
    }
    html=html.replace(new RegExp(NUL+"IC(\\d+)"+NUL,"g"),(m,n)=>"<code>"+inls[+n]+"</code>");
    html=html.replace(new RegExp(NUL+"CB(\\d+)"+NUL,"g"),(m,n)=>"<pre><code>"+blocks[+n]+"</code></pre>");
    return html;
  }

  // Conversations are stored server-side per signed-in student (cloud sync) and
  // each belongs to a class. The tutor answers from the active class's rules.
  // Local chat shape: {id, title, classId, messages:[], loaded:bool, isNew:bool}
  //   id      — the server chat_id once saved; a temp id before the first message
  //   loaded  — whether this chat's messages have been fetched from the server
  //   isNew   — a blank conversation not yet persisted on the server
  let chats=[],activeChatId=null,USER=null,IS_TEACHER=false;
  let ALL_CHATS=[],CLASSES=[],ACTIVE_CLASS=null;     // class state
  const CLASS_KEY="chronos_student_class";
  const els={chatList:document.getElementById("chatList"),messagesInner:document.getElementById("messagesInner"),input:document.getElementById("input"),sendBtn:document.getElementById("sendBtn"),newChatBtn:document.getElementById("newChatBtn"),newChatBtnMobile:document.getElementById("newChatBtnMobile"),statusDot:document.getElementById("statusDot"),statusText:document.getElementById("statusText"),messages:document.getElementById("messages")};

  function tempId(){return"new_"+Math.random().toString(36).slice(2,10);}
  function activeChat(){return chats.find(c=>c.id===activeChatId);}

  function newChat(){
    if(!ACTIVE_CLASS)return;
    // Don't stack blank chats — reuse an existing empty one if present.
    const blank=chats.find(c=>c.isNew&&c.messages.length===0);
    const c=blank||{id:tempId(),title:"New chat",classId:ACTIVE_CLASS,messages:[],loaded:true,isNew:true};
    if(!blank)chats.unshift(c);
    selectChat(c.id);els.input.focus();
  }

  async function selectChat(id){
    activeChatId=id;renderSidebar();renderMessages();
    const c=activeChat();
    if(c&&!c.loaded){await loadMessages(c);}
  }

  async function loadMessages(c){
    try{
      const d=await Chronos.apiJson("/chats/"+encodeURIComponent(c.id)+"/messages",undefined,"GET");
      // gap follows the server's `grounded` flag, not the length of `rules` —
      // students aren't sent the sources at all (see /chats/<id>/messages).
      c.messages=(d.messages||[]).map(m=>({role:m.role,content:m.content,rules:m.rules||[],gap:m.role==="teacher"&&!m.grounded}));
      c.loaded=true;
      if(c.id===activeChatId)renderMessages();
    }catch(e){setStatus("offline");}
  }

  async function deleteChat(id){
    const c=chats.find(x=>x.id===id);if(!c)return;
    if(!c.isNew){
      if(!confirm("Delete this conversation?"))return;
      try{await Chronos.apiJson("/chats/"+encodeURIComponent(id),undefined,"DELETE");}
      catch(e){setStatus("offline");return;}
    }
    chats=chats.filter(x=>x.id!==id);
    if(activeChatId===id){ if(chats.length)selectChat(chats[0].id); else newChat(); }
    else renderSidebar();
  }

  function renderSidebar(){
    els.chatList.innerHTML="";
    paintHeader();
    chats.forEach(c=>{
      const on=c.id===activeChatId;
      const row=document.createElement("div");
      row.className="group chat-row"+(on?" on":"");
      const it=document.createElement("button");
      it.className="flex-1 min-w-0 text-left px-3 py-2.5 font-label-md text-label-md truncate";
      it.textContent=c.title;
      it.onclick=()=>selectChat(c.id);
      const del=document.createElement("button");
      del.className="px-2 opacity-0 group-hover:opacity-100 transition-opacity hover:text-error flex-shrink-0";
      del.title="Delete conversation";
      del.innerHTML='<span class="material-symbols-outlined text-[18px]">delete</span>';
      del.onclick=(e)=>{e.stopPropagation();deleteChat(c.id);};
      row.appendChild(it);row.appendChild(del);
      els.chatList.appendChild(row);
    });
  }

  // Class-agnostic openers — the server has no notion of suggested questions, so
  // these work against any class's material rather than inventing topics.
  const STARTERS=["What does this class cover so far?","Explain the main idea from the latest material.","What should I revise first?"];

  function className(){const c=CLASSES.find(x=>x.id===ACTIVE_CLASS);return c?c.name:"";}

  function paintHeader(){
    const c=activeChat();
    $s("threadTitle").textContent=(c&&c.title)||"New chat";
    $s("threadClass").textContent=className();
  }

  function renderMessages(){
    const c=activeChat();
    els.messagesInner.innerHTML="";
    paintHeader();
    if(!c||c.messages.length===0){
      const e=document.createElement("div");
      e.className="pt-10 pb-2";
      const h=document.createElement("h2");
      h.className="font-headline-lg text-headline-lg text-on-background mb-3";
      // textContent, not innerHTML: the class name is teacher-supplied.
      h.textContent="Ask anything from "+(className()||"this class");
      const p=document.createElement("p");
      p.className="font-body-lg text-body-lg text-on-surface-variant mb-7 max-w-[48ch]";
      p.textContent="Answers come from the documents your teacher uploaded. Where the material stops, so do the answers.";
      const list=document.createElement("div");
      list.style.borderTop="1px solid var(--c-rule)";
      STARTERS.forEach(t=>{
        const b=document.createElement("button");
        b.className="starter";
        b.innerHTML='<span></span><span class="material-symbols-outlined text-[19px] text-on-surface-variant flex-shrink-0">arrow_forward</span>';
        b.firstChild.textContent=t;
        b.onclick=()=>{els.input.value=t;send();};
        list.appendChild(b);
      });
      e.appendChild(h);e.appendChild(p);e.appendChild(list);
      els.messagesInner.appendChild(e);
      return;
    }
    c.messages.forEach(m=>els.messagesInner.appendChild(buildMsgEl(m)));
    scrollBottom();
  }

  function buildMsgEl(m){
    if(m.role==="student"){
      const w=document.createElement("div");w.className="flex flex-col items-end mb-stack-lg pr-1.5";
      const b=document.createElement("div");
      b.className="bub-you";
      b.textContent=m.content;
      w.appendChild(b);return w;
    }
    const w=document.createElement("div");w.className="flex flex-col items-start mb-stack-lg";
    const b=document.createElement("div");
    b.className="ai-prose bub-ai";
    if(m.content){b.innerHTML=renderMarkdown(m.content);}
    w.appendChild(b);
    // An answer with no sources behind it is the "not in this class's material"
    // refusal — the same empty-rules signal the server counts as a knowledge gap.
    if(m.gap)w.appendChild(gapNote());
    // Sources are teacher-only: students never see the underlying material,
    // teachers get a collapsible dropdown beneath the answer.
    if(IS_TEACHER&&m.rules&&m.rules.length){w.appendChild(buildSourcesDropdown(m.rules));}
    return w;
  }

  function gapNote(){
    const p=document.createElement("p");
    p.className="mt-3.5 text-primary text-[13.5px] leading-relaxed";
    p.textContent="Sent to your teacher as a gap in the class material.";
    return p;
  }

  // Teacher-only "Sources used" dropdown: a collapsed disclosure under an answer
  // that expands to the exact passages the tutor drew on. Hidden from students.
  function buildSourcesDropdown(rules){
    const d=document.createElement("details");
    d.className="src-drop mt-3 max-w-[85%]";
    const s=document.createElement("summary");
    s.className="cursor-pointer select-none px-3 py-2 tagline flex items-center gap-1.5";
    s.innerHTML='<span class="material-symbols-outlined text-[16px]">menu_book</span>'+
      '<span>Sources used ('+rules.length+')</span>'+
      '<span class="material-symbols-outlined text-[18px] ml-auto chev transition-transform">expand_more</span>';
    d.appendChild(s);
    const body=document.createElement("div");
    body.className="px-3 pb-3 space-y-1.5";
    body.style.borderTop="2px solid var(--gold)";
    rules.forEach(x=>{
      const ln=document.createElement("p");
      ln.className="font-body-md text-[13px] leading-snug pt-2";
      ln.style.color="var(--c-sub)";
      ln.textContent=x;
      body.appendChild(ln);
    });
    d.appendChild(body);
    return d;
  }

  function scrollBottom(){els.messages.scrollTop=els.messages.scrollHeight;}

  const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Type the answer out over a bounded total duration instead of a fixed delay
  // per character. The old version advanced ONE character per tick at up to 8ms
  // each, so a 2,000-character answer sat there typing for ~16 seconds — and it
  // rewrote the element's whole textContent every tick (quadratic work). Now the
  // characters-per-frame scales with length, so long answers land just as fast as
  // short ones, and each frame only pokes a single text node.
  function typeOut(b,text,done){
    const cur=document.createElement("span");cur.className="cursor";
    const node=document.createTextNode("");
    b.textContent="";b.appendChild(node);b.appendChild(cur);
    const finish=()=>{cur.remove();b.innerHTML=renderMarkdown(text);scrollBottom();if(done)done();};
    if(!text||reduceMotion){finish();return;}
    const dur=Math.min(1600,Math.max(350,text.length*4));
    const t0=performance.now();
    (function step(now){
      const p=Math.min((now-t0)/dur,1);
      node.nodeValue=text.slice(0,Math.ceil(p*text.length));
      scrollBottom();
      if(p<1)requestAnimationFrame(step); else finish();
    })(t0);
  }

  async function send(){
    const text=els.input.value.trim();if(!text)return;
    if(!activeChat())newChat();
    const c=activeChat();
    c.messages.push({role:"student",content:text});
    if(c.messages.length===1){c.title=text.length>30?text.slice(0,30)+"…":text;renderSidebar();}
    els.input.value="";els.input.style.height="auto";
    renderMessages();
    setSending(true);
    const tm={role:"teacher",content:"",rules:[]};c.messages.push(tm);
    const el=buildMsgEl(tm);els.messagesInner.appendChild(el);
    const b=el.querySelector(".ai-prose");b.innerHTML='<span class="cursor"></span>';scrollBottom();
    try{
      // The tutor answers from this chat's class. Omit chat_id for a not-yet-saved
      // conversation; the server creates one.
      const body={message:text,class_id:c.classId||ACTIVE_CLASS};
      if(!c.isNew)body.chat_id=c.id;
      const res=await Chronos.apiFetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      setStatus("online");
      const data=await res.json();
      if(!res.ok||data.error){b.textContent=(data.details||data.error||"Something went wrong. Please try again.");tm.content=b.textContent;setSending(false);return;}
      // Adopt the server's chat id/title for a freshly-created conversation.
      if(data.chat_id&&c.isNew){c.id=data.chat_id;c.isNew=false;c.loaded=true;if(data.title)c.title=data.title;if(activeChatId&&activeChatId.startsWith("new_"))activeChatId=c.id;ALL_CHATS.unshift(c);renderSidebar();}
      // `grounded` comes from the server, which is the only side that can see
      // the sources: students are never sent rules_used, so an empty list here
      // no longer means "nothing backed this answer".
      tm.content=data.response||"";tm.rules=data.rules_used||[];tm.gap=!data.grounded;
      b.textContent="";
      typeOut(b,tm.content,()=>{
        if(tm.gap)el.appendChild(gapNote());
        if(IS_TEACHER&&tm.rules.length){el.appendChild(buildSourcesDropdown(tm.rules));}
        scrollBottom();setSending(false);
      });
    }catch(err){
      setStatus("offline");
      b.textContent=(err&&err.message)||"Can't reach the server. Is app.py running on port 5000?";tm.content=b.textContent;setSending(false);
    }
  }

  function setSending(on){els.sendBtn.disabled=on;els.input.disabled=on;if(!on)els.input.focus();}

  function setStatus(state){
    if(state==="online"){els.statusDot.className="w-2 h-2 block bg-secondary";els.statusText.textContent="Online";}
    else if(state==="waking"){els.statusDot.className="w-2 h-2 block bg-secondary animate-pulse";els.statusText.textContent="Waking server…";}
    else{els.statusDot.className="w-2 h-2 block bg-error";els.statusText.textContent="Offline";}
  }

  async function checkServer(){
    // Free hosting (e.g. Render) sleeps after inactivity and can take ~50s to wake,
    // erroring meanwhile. Retry a few times and show "Waking…" so a sleeping-but-
    // reachable server isn't misreported as a hard "Offline".
    for(let i=0;i<3;i++){
      try{const r=await fetch(API_BASE+"/health",{cache:"no-store"});if(r.ok){setStatus("online");return;}}catch{}
      setStatus("waking");
      await new Promise(res=>setTimeout(res,2500));
    }
    setStatus("offline");
  }

  const $s=id=>document.getElementById(id);

  // wiring
  els.sendBtn.onclick=send;
  els.newChatBtn.onclick=newChat;
  els.newChatBtnMobile.onclick=newChat;
  els.input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
  els.input.addEventListener("input",()=>{els.input.style.height="auto";els.input.style.height=Math.min(els.input.scrollHeight,160)+"px";});
  $s("logoutBtn").onclick=async()=>{try{await Chronos.logout();}catch(e){}ChronosWipe.go("login.html?role=student",true);};
  $s("joinLogoutBtn").onclick=async()=>{try{await Chronos.logout();}catch(e){}ChronosWipe.go("login.html?role=student",true);};
  $s("classSwitcher").onchange=e=>switchClass(e.target.value);
  $s("joinAnotherBtn").onclick=()=>showJoinGate();
  $s("joinBtn").onclick=submitJoin;
  $s("joinCodeInput").addEventListener("keydown",e=>{if(e.key==="Enter")submitJoin();});

  function paintClassSwitcher(){
    const sel=$s("classSwitcher");sel.innerHTML="";
    CLASSES.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
    if(ACTIVE_CLASS)sel.value=ACTIVE_CLASS;
  }

  // Load classes; returns true if the student is in at least one.
  async function loadClasses(){
    try{CLASSES=await Chronos.listClasses();}catch(e){CLASSES=[];}
    let pick=localStorage.getItem(CLASS_KEY);
    if(!CLASSES.find(c=>c.id===pick))pick=CLASSES.length?CLASSES[0].id:null;
    ACTIVE_CLASS=pick;
    if(ACTIVE_CLASS)localStorage.setItem(CLASS_KEY,ACTIVE_CLASS);
    paintClassSwitcher();
    return CLASSES.length>0;
  }

  function switchClass(id){
    if(!id||id===ACTIVE_CLASS)return;
    ACTIVE_CLASS=id;localStorage.setItem(CLASS_KEY,id);
    paintClassSwitcher();
    applyClassFilter();
  }

  // Show only the active class's conversations.
  function applyClassFilter(){
    chats=ALL_CHATS.filter(c=>c.classId===ACTIVE_CLASS);
    activeChatId=null;
    if(chats.length){renderSidebar();selectChat(chats[0].id);}
    else newChat();
  }

  // Load this student's saved conversations (all classes) from the server.
  async function loadChats(){
    try{
      const d=await Chronos.apiJson("/chats",undefined,"GET");
      ALL_CHATS=(d.chats||[]).map(c=>({id:c.id,title:c.title,classId:c.class_id,messages:[],loaded:false,isNew:false}));
    }catch(e){ALL_CHATS=[];}
    applyClassFilter();
  }

  function showJoinGate(){
    $s("joinErr").classList.add("hidden");
    $s("joinCodeInput").value="";
    $s("joinGate").classList.remove("hidden");
    $s("joinCodeInput").focus();
  }
  function hideJoinGate(){$s("joinGate").classList.add("hidden");}

  // Teachers own classes — they should never be asked to *join* one with a code.
  // If a teacher reaches the tutor without a class, point them at the Knowledge
  // Base to create one instead of showing the student join-code box.
  function showTeacherNoClassGate(){
    $s("joinCard").innerHTML=
      '<div class="w-14 h-14 bg-secondary text-on-secondary flex items-center justify-center mx-auto mb-stack-md">'+
        '<span class="material-symbols-outlined text-[28px]">school</span></div>'+
      '<h1 class="font-headline-md text-headline-md text-on-background mb-2">Make a class first</h1>'+
      '<p class="font-body-md text-body-md text-on-surface-variant mb-stack-md">You haven’t got any classes yet. Set one up in the Knowledge Base and you can try the tutor on your own material.</p>'+
      '<a class="kbtn w-full" href="teacherknowledge.html"><span>'+
        '<span class="material-symbols-outlined text-[18px] align-middle">add</span> Go to Knowledge Base</span></a>'+
      '<button class="inline-block mt-stack-md font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" id="teacherGateLogout">Sign out</button>';
    const out=$s("teacherGateLogout");
    if(out)out.onclick=async()=>{try{await Chronos.logout();}catch(e){}ChronosWipe.go("login.html?role=teacher",true);};
    $s("joinGate").classList.remove("hidden");
  }

  async function submitJoin(){
    const code=$s("joinCodeInput").value.trim().toUpperCase();
    if(!code){$s("joinErr").textContent="Enter a class code.";$s("joinErr").classList.remove("hidden");return;}
    $s("joinBtn").disabled=true;
    try{
      const cls=await Chronos.joinClass(code);
      ACTIVE_CLASS=cls.id;localStorage.setItem(CLASS_KEY,cls.id);
      await loadClasses();
      ACTIVE_CLASS=cls.id;localStorage.setItem(CLASS_KEY,cls.id);paintClassSwitcher();
      hideJoinGate();
      await loadChats();
    }catch(e){
      $s("joinErr").textContent=(e&&e.message)||"Could not join.";$s("joinErr").classList.remove("hidden");
    }
    $s("joinBtn").disabled=false;
  }

  // Gate the page on a signed-in user. Teachers can use the tutor too, so both
  // roles are allowed here (the backend /chat accepts any signed-in user).
  Chronos.requireRole(["student","teacher"]).then(async(info)=>{
    USER=info;
    IS_TEACHER=info.role==="teacher";
    const em=$s("userEmail");em.textContent=info.email||"Account";em.title=info.email||"";
    $s("userInitials").textContent=(info.email||"?").slice(0,2).toUpperCase();
    // Reflect the signed-in role: a teacher trying the tutor isn't a student.
    const role=IS_TEACHER?"Teacher":"Student";
    $s("modeLabel").textContent=role;$s("roleLabel").textContent=role;
    // Show a way back to the teacher panels when a teacher is using the tutor.
    if(IS_TEACHER){$s("teacherBackLink").classList.remove("hidden");$s("teacherBackLink").classList.add("flex");}
    $s("authGate").remove();
    const hasClass=await loadClasses();
    if(!hasClass){ info.role==="teacher" ? showTeacherNoClassGate() : showJoinGate(); }
    else { await loadChats(); if(window.__tutFirstVisit)window.__tutFirstVisit(); }
    checkServer();setInterval(checkServer,15000);
  }).catch(e=>{
    // textContent, not innerHTML: this string comes off the wire.
    const g=$s("authGate");g.textContent="";
    const p=document.createElement("p");
    p.className="font-body-md text-body-md text-error text-center px-6";
    p.textContent=(e&&e.message)||"Sign-in required";
    g.appendChild(p);
  });
</script>

<!-- How-it-works tutorial -->
<div class="hidden fixed inset-0 z-[60] flex items-center justify-center p-margin-mobile" style="background:rgba(11,11,12,.72)" id="tut">
<div class="w-full max-w-md bg-surface-container-lowest hard cast-red p-stack-lg max-h-[85vh] overflow-y-auto">
<div class="flex items-start justify-between gap-3 mb-stack-md">
<h2 class="font-headline-md text-headline-md text-on-background" id="tutTitle"></h2>
<button class="ibtn flex-shrink-0" id="tutClose"><span class="material-symbols-outlined">close</span></button>
</div>
<div class="space-y-stack-md" id="tutBody"></div>
<div class="flex items-center justify-center gap-1.5 mt-stack-md" id="tutDots"></div>
<button class="kbtn w-full mt-stack-lg" id="tutDone"><span>Continue</span></button>
</div>
</div>
<script>
  (function(){
    const TITLE="Quick tour";
    const KEY="chronos_tut_student_v2";
    const STEPS=[
      {icon:"school",title:"Pick your class",text:"Use the class menu on the left. Each class only knows what that teacher put into it, so make sure you're on the right one."},
      {icon:"forum",title:"Just ask",text:"Type your question and hit Enter. Answers come straight out of your teacher's notes and files, so it isn't making things up."},
      {icon:"flag",title:"If it's not there, it'll say so",text:"Asked something your teacher hasn't covered yet? You'll get told, not fobbed off with a guess. Worth mentioning to them so they can add it."},
    ];
    let idx=0;
    const body=document.getElementById("tutBody");
    const dots=document.getElementById("tutDots");
    const doneBtn=document.getElementById("tutDone");
    document.getElementById("tutTitle").textContent=TITLE;

    function render(){
      const s=STEPS[idx];
      body.innerHTML='<div class="flex items-start gap-3">'+
        '<span class="w-10 h-10 flex-shrink-0 bg-primary text-on-primary flex items-center justify-center"><span class="material-symbols-outlined text-[20px]">'+s.icon+'</span></span>'+
        '<div><h3 class="font-label-md text-label-md text-on-surface mb-0.5" style="font-family:\'Schibsted Grotesk\',sans-serif;text-transform:none">'+s.title+'</h3>'+
        '<p class="font-body-md text-body-md text-on-surface-variant leading-snug">'+s.text+'</p></div></div>';
      dots.innerHTML="";
      STEPS.forEach((_,i)=>{
        const d=document.createElement("span");
        d.className="h-2 transition-all "+(i===idx?"w-6 bg-primary":"w-2 bg-outline");
        dots.appendChild(d);
      });
      doneBtn.querySelector("span").textContent = idx===STEPS.length-1 ? "Got it" : "Continue";
    }

    const modal=document.getElementById("tut");
    const open=()=>{idx=0;render();modal.classList.remove("hidden");};
    const close=()=>{modal.classList.add("hidden");try{localStorage.setItem(KEY,"1");}catch(e){}};
    document.getElementById("tutClose").onclick=close;
    // Each click only ever advances one step — no skipping ahead, and no
    // dismissing by clicking the backdrop, so the steps actually get read.
    doneBtn.onclick=()=>{ if(idx<STEPS.length-1){idx++;render();} else {close();} };
    const help=document.getElementById("tutHelp");if(help)help.onclick=open;
    // Auto-open only once the app is ready (the main script calls this after the
    // loading/join gates clear), so it never pops over a full-screen spinner.
    window.__tutFirstVisit=function(){try{if(!localStorage.getItem(KEY))open();}catch(e){}};
  })();
</script>
</body></html>
