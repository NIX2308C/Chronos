# Builds the Chronos TWA and publishes the APK as a GitHub Release asset.
#
# This runs here rather than locally on purpose: the Android SDK and Google's
# Maven repository both live on dl.google.com, which is unreachable from the
# environment the project is developed in. GitHub's runners ship the SDK.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      host:
        description: >-
          Host the app should open, with no scheme. Defaults to the live site;
          override only to build against staging.
        required: true
        default: chronos.tevproject.com
  push:
    branches: [android-app]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write        # needed to create the release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the target host
        id: cfg
        run: |
          HOST="${{ github.event.inputs.host || 'chronos.tevproject.com' }}"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$HOST" | tr '.' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Not android-actions/setup-android: it runs `sdkmanager tools`, and the
      # `tools` package was removed from the SDK, so it fails outright. The
      # runner image already ships the SDK — this just accepts the licences and
      # installs the pieces this build needs, with no third-party action.
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK"      >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK"  >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PtwaHost=${{ steps.cfg.outputs.host }}

      - name: Name the artefact
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$SRC" || { echo "::error::no APK produced at $SRC"; exit 1; }
          OUT="chronos-${{ steps.cfg.outputs.slug }}-debug.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --target "${{ github.sha }}" \
            --title "Chronos Android (debug) — build ${{ github.run_number }}" \
            --prerelease \
            --notes "Debug-signed Trusted Web Activity, built from \`android/\`.

          **Opens:** \`https://${{ steps.cfg.outputs.host }}/login.html\`

          Sideload only — a debug-signed APK cannot be uploaded to Play, which
          needs a release key and Play App Signing. It will show a browser URL
          bar until the host serves \`/.well-known/assetlinks.json\` carrying the
          SHA-256 of the key that signed this build.

          To point it at a real deployment, run this workflow again from the
          Actions tab and set the \`host\` input."
